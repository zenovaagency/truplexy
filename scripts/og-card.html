<!doctype html>
<!--
  Source of public/og-card.png (1200×630). Render it with `npm run og`.
  Copy follows the launch film: the end line "Every channel. One platform."
  Colours and type are the site's tokens (src/styles/tokens.css).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Truplexy OG card</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 200 800;
        src: url('../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        position: relative;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        color: #0e1222;
        background:
          radial-gradient(60% 75% at 8% 4%, rgb(207 239 255 / 0.95), transparent 70%),
          radial-gradient(60% 75% at 94% 98%, rgb(234 217 255 / 0.95), transparent 70%),
          #f7f8fc;
      }

      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 54px;
      }

      .wordmark { height: 58px; width: auto; display: block; }

      h1 {
        margin-top: 46px;
        font-size: 100px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      h1 span {
        display: block;
        padding-bottom: 0.08em;
        background: linear-gradient(95deg, #1f7bff 0%, #2338e6 45%, #6a2bff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sub {
        margin-top: 22px;
        font-size: 29px;
        line-height: 1.35;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #4a5068;
      }

      .channels {
        margin-top: 38px;
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .channels li {
        list-style: none;
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid #e3e6f0;
        box-shadow: 0 14px 30px rgb(35 56 230 / 0.1);
      }

      .channels img { width: 32px; height: 32px; display: block; }

      .channels .more {
        width: auto;
        padding: 0 20px;
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #61688a;
      }

      .wave { position: absolute; left: 0; bottom: 0; width: 1200px; height: 70px; }

      .url {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26px;
        font-family: 'Geist Mono', monospace;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #2338e6;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <svg class="wave" viewBox="0 0 1200 70" aria-hidden="true">
      <defs>
        <linearGradient id="t" x1="0" x2="1">
          <stop offset="0" stop-color="#45d4ff" />
          <stop offset="0.45" stop-color="#1f7bff" />
          <stop offset="1" stop-color="#6a2bff" />
        </linearGradient>
      </defs>
      <path d="M-20 22 C 260 -8, 420 52, 640 24 S 1020 -6, 1220 16" fill="none" stroke="url(#t)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    </svg>

    <main class="card">
      <img class="wordmark" src="../src/assets/brand/wordmark-dark.png" alt="Truplexy" />
      <h1>Every channel.<span>One platform.</span></h1>
      <p class="sub">A human-like AI assistant on every channel, and one platform for your team.</p>
      <ul class="channels" aria-hidden="true">
        <li><img src="../public/brands/whatsapp.svg" alt="" /></li>
        <li><img src="../public/brands/instagram.svg" alt="" /></li>
        <li><img src="../public/brands/messenger.svg" alt="" /></li>
        <li><img src="../public/brands/telegram.svg" alt="" /></li>
        <li><img src="../public/brands/discord.svg" alt="" /></li>
        <li class="more">+ website, email &amp; more</li>
      </ul>
      <p class="url">truplexy.com</p>
    </main>
  </body>
</html>
