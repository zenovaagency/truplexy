openapi: 3.0.3
info:
  title: Truplexy API
  version: 3.0.0
  description: Businesses sign up with Supabase Auth and their members act by role (owner, admin, editor, agent, viewer); each business has its plan's limits and its own bots, knowledge, tools, tickets and keys. Health, a multi-tenant chat API for other platforms that answers with each bot's saved configuration, grounded answers with statuses and citations, an authenticated playground with stored conversations, knowledge retrieval and tool calling, admin endpoints for the workspace, knowledge base, tools, and usage stats, and support tickets with human escalation - while a conversation's ticket is escalated, the assistant stores the customer's messages without replying and people answer from the dashboard. Integrations stay in sync both ways - replies people write on the platform are recorded through the chat API, and a signed webhook reports replies and ticket changes made in the dashboard. Cloudflare is the only store - D1 for records, R2 for files and document text, Vectorize for embeddings, and Workers AI for embedding, reranking, and document conversion. Health does not access Cloudflare.
servers:
  - url: https://api.truplexy.com/v3
    description: Production
  - url: http://localhost:3000/v3
    description: Local server
  - url: https://api.truplexy.com/v2
    description: Serves the same endpoints and responses as v3. Kept so clients can move to v3 at their own pace.
  - url: https://api.truplexy.com/v1
    description: Deprecated. Serves the endpoints v1 had, with Deprecation, Link (successor-version, pointing at v3) and, when scheduled, Sunset headers. Endpoints added in v2 are not available here.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the HTTP application is running
      security: []
      responses:
        '200':
          description: Application is running; this is not a database readiness check.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        default:
          $ref: '#/components/responses/Error'
  /playground/run:
    post:
      operationId: runPlayground
      summary: Run an LLM test through OpenRouter
      description: The playground key runs for the default bot; a member token runs for the bot its X-Truplexy-Tenant and X-Truplexy-Bot headers name, with playground.run. A business whose AI replies this month reached its plan gets 429 PLAN_LIMIT_REACHED. With conversation_id, the message and reply are stored and the conversation's latest RAG_HISTORY_TURNS exchanges (up to 16000 characters) are sent as history; without it, send earlier turns in history and nothing is stored. Each reply's model, token counts, cost, and latency are recorded in usage_records (a failed write does not fail the reply). With rag_enabled, the backend retrieves knowledge itself - follow-ups rewritten into standalone queries, Vectorize and D1 FTS5 search fused with Reciprocal Rank Fusion, reranked, deduplicated and cut to RAG_CONTEXT_TOKENS - and sends the passages as numbered sources; the reply quotes them in their own words and reports a status and the sources it used. Small talk sends nothing; when retrieval fails or finds no usable evidence and tools are off, the reply is no_answer without a model call. With tools_enabled, the model may call the named tools; the backend validates each call's arguments, runs it, records it in tool_runs (when D1 is configured), and returns the result to the model, for at most 4 rounds of up to 5 calls, all within the reply's time limit (CHAT_REPLY_TIMEOUT_MS, 45 seconds by default). No automatic retries.
      security:
        - PlaygroundKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message, max_output_tokens]
              properties:
                message:
                  type: string
                  maxLength: 4000
                  description: The newest user message, 1-4000 characters. May be empty with resend, and when attachments is set.
                attachments:
                  $ref: '#/components/schemas/AttachmentIDs'
                conversation_id:
                  type: string
                  pattern: '^conv_[0-9a-f]{32}$'
                  description: A stored playground conversation to continue. Not allowed with history.
                resend:
                  type: boolean
                  description: With conversation_id, answer the last stored message again, replacing any reply. When message is set and differs from it, or was never stored, message is stored and answered.
                history:
                  type: array
                  maxItems: 40
                  description: Only without conversation_id. Earlier messages in the conversation, oldest first, sent to the model before message. Content totals at most 64000 characters.
                  items:
                    type: object
                    additionalProperties: false
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        minLength: 1
                        maxLength: 16000
                system_prompt:
                  type: string
                  maxLength: 20000
                model:
                  type: string
                  maxLength: 120
                  description: OpenRouter model ID (for example google/gemini-3.1-flash-lite). Blank uses LLM_MODEL from the backend environment.
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  description: Omit to use the provider default.
                max_output_tokens:
                  type: integer
                  minimum: 1
                  maximum: 32768
                rag_enabled:
                  type: boolean
                  description: Retrieve relevant knowledge for the message. When none is relevant, the model is told not to guess business details.
                rag_top_k:
                  type: integer
                  minimum: 1
                  maximum: 20
                  description: Only with rag_enabled. The most passages to send; defaults to 4.
                web_search:
                  $ref: '#/components/schemas/WebSearchOptions'
                tools_enabled:
                  type: boolean
                  description: Let the model call the tools named in tools.
                tools:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  description: Required with tools_enabled and not allowed without it. Names from GET /tools; each must be available.
                  items:
                    type: string
                    pattern: '^[a-z][a-z0-9_]{0,63}$'
                filters:
                  $ref: '#/components/schemas/RetrievalFilters'
                debug:
                  type: boolean
                  description: Return the retrieval trace as debug. Only the playground and admin keys may ask for it.
      responses:
        '200':
          description: Actual provider reply; token usage is null if the provider omits it. A no-answer without a model call has finish_reason no_answer and null usage.
          content:
            application/json:
              schema:
                type: object
                required: [output, model, latency_ms, usage, finish_reason, tool_calls]
                properties:
                  output:
                    type: string
                  model:
                    type: string
                  latency_ms:
                    type: integer
                  finish_reason:
                    type: string
                  usage:
                    type: object
                    nullable: true
                    properties:
                      input_tokens:
                        type: integer
                      output_tokens:
                        type: integer
                      total_tokens:
                        type: integer
                      cost:
                        type: number
                        description: OpenRouter credits charged (1 credit = 1 USD); 0 if not reported.
                    description: Added up across every model request in the reply.
                  tool_calls:
                    type: array
                    description: Every tool call, in order; empty when none ran.
                    items:
                      $ref: '#/components/schemas/ToolCall'
                  status:
                    $ref: '#/components/schemas/AnswerStatus'
                  sources:
                    type: array
                    nullable: true
                    description: The document sections the reply cites, only ever ones that were sent; empty unless status is answered; null with rag_enabled false.
                    items:
                      $ref: '#/components/schemas/KnowledgeSource'
                  context_tokens:
                    type: integer
                    description: Estimated tokens of knowledge sent with the message.
                  debug:
                    $ref: '#/components/schemas/RetrievalTrace'
                  conversation_id:
                    type: string
                  user_message:
                    $ref: '#/components/schemas/StoredMessage'
                  reply:
                    $ref: '#/components/schemas/StoredMessage'
        '401':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /playground/conversations:
    post:
      operationId: createConversation
      summary: Start an empty playground conversation
      description: Deletes the bot's earlier playground conversations and their messages, except one that has a ticket. Usage and cost records are kept.
      security:
        - PlaygroundKey: []
        - MemberToken: []
      responses:
        '201':
          description: The new conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        default:
          $ref: '#/components/responses/Error'
  /playground/conversations/current:
    get:
      operationId: getCurrentConversation
      summary: The most recently active playground conversation with up to 200 of its latest messages
      security:
        - PlaygroundKey: []
        - MemberToken: []
      responses:
        '200':
          description: The conversation, or null when there is none.
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    allOf:
                      - $ref: '#/components/schemas/Conversation'
                    nullable: true
        default:
          $ref: '#/components/responses/Error'
  /playground/attachments/config:
    get:
      operationId: getPlaygroundAttachmentConfig
      summary: Whether pictures can be attached, and the limits (image input)
      description: A 404 NOT_FOUND means the API predates the feature, which a client treats as enabled false. Needs playground.run.
      security:
        - PlaygroundKey: []
        - MemberToken: []
      responses:
        '200':
          description: The limits, or why pictures are off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentConfig'
        default:
          $ref: '#/components/responses/Error'
  /playground/attachments:
    post:
      operationId: createPlaygroundAttachment
      summary: Register a picture and get a presigned URL to upload it to R2 (image input)
      description: PUT the file to url with exactly headers within 15 minutes, then send the attachment's id in attachments on POST /playground/run. Registration checks only the declared details; the file itself is read, checked and shrunk (long edge at most 1280 px, JPEG, at most 1 MiB, metadata removed) when the message is sent. 403 PLAN_LIMIT_REACHED with limit image_input when the plan has no image input; 400 FEATURE_UNAVAILABLE when no active model can read pictures; 413 IMAGE_TOO_LARGE over 20 MB; 400 UNSUPPORTED_IMAGE_TYPE. Needs playground.run.
      security:
        - PlaygroundKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRegistration'
      responses:
        '201':
          description: Where to upload the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUpload'
        default:
          $ref: '#/components/responses/Error'
  /conversations:
    post:
      operationId: createChatConversation
      summary: Start a chat API conversation
      description: Conversations started here are kept apart from the playground's. Replies use the bot configuration saved in the dashboard. The conversation is on the channel the body names, or else the one the key is bound to, and its tickets carry the channel. 404 CHANNEL_NOT_FOUND for a channel the bot doesn't have; 403 CHANNEL_DISABLED for one turned off.
      security:
        - ChatKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                channel_id:
                  type: string
                  pattern: '^chn_[0-9a-f]{32}$'
                  description: One of the bot's channels (v2), instead of the key's.
                customer_id:
                  type: string
                  pattern: '^cus_[0-9a-f]{32}$'
                  description: One of the bot's customers (v2), from PUT /customer; the conversation and its tickets are theirs. 404 CUSTOMER_NOT_FOUND for one the bot doesn't have.
      responses:
        '201':
          description: The new, empty conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    get:
      operationId: getChatConversation
      summary: A chat API conversation with up to 200 of its latest messages
      description: Customer messages that got no reply are left out. Unknown IDs, and playground conversations, return 404 CONVERSATION_NOT_FOUND.
      security:
        - ChatKey: []
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: sendChatMessage
      summary: Send a customer message and get the reply
      description: Answers with the bot configuration saved in the dashboard (system prompt, model, temperature, output limit, knowledge retrieval, and tools), sending the conversation's recent messages as history. Both messages are stored and usage is recorded. A reply has 45 seconds by default (CHAT_REPLY_TIMEOUT_MS), including tool calls. A message starting with "[Context only" (such as a ticket's earlier history an integration passes on) is stored as history without a reply (status context). A message that only carries media the assistant can't see, such as "[sent an attachment in Discord]", gets a request to describe it (status clarification_required). With attachments (image input) the assistant reads the pictures in this reply only; they are read, checked and shrunk before anything is stored, so a picture error (400 INVALID_IMAGE, 400 UNSUPPORTED_IMAGE_TYPE, 413 IMAGE_TOO_LARGE, 404 ATTACHMENT_NOT_FOUND, 409 ATTACHMENT_NOT_UPLOADED) leaves nothing behind. After a handoff_offered reply, a message saying yes ("yes please", "sure") accepts the offer as the handoff endpoint does.
      security:
        - ChatKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: |
            Makes the send happen once per key. A repeat after the first finished returns the first response (with Idempotent-Replayed: true) without a second stored message or paid reply; a repeat while the first is still running is 409 REQUEST_IN_PROGRESS (Retry-After 2); the same key with a different message is 422 IDEMPOTENCY_KEY_REUSED. A send that failed can be retried under its key. Responses are kept 24 hours. If keys can't be stored the request is 503 IDEMPOTENCY_UNAVAILABLE and nothing is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 4000
                  description: The customer's message, trimmed before it is checked. 1-4000 characters, or empty when attachments is set.
                attachments:
                  $ref: '#/components/schemas/AttachmentIDs'
      responses:
        '200':
          description: The stored customer message and the reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReply'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: createChatAttachment
      summary: Register a picture for this conversation and get a presigned upload URL (image input)
      description: Same request, response and errors as POST /playground/attachments, plus 404 CONVERSATION_NOT_FOUND. The attachment can only be sent in this conversation, once, within an hour (404 ATTACHMENT_NOT_FOUND after that). Call from the integration's server, never a browser.
      security:
        - ChatKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRegistration'
      responses:
        '201':
          description: Where to upload the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUpload'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/escalate:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: escalateChatConversation
      summary: Hand the conversation to a person
      description: For a "talk to a person" button. Opens an escalated ticket for the conversation, or escalates its open ticket. Until a person resolves or closes the ticket (or turns escalation off), messages sent to the conversation are stored without a reply (status escalated, reply null), and people reply from the dashboard's Tickets page; their replies appear in the conversation with author agent. Repeating the call changes nothing.
      security:
        - ChatKey: []
      responses:
        '200':
          description: The conversation, now escalated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: resumeChatConversation
      summary: Hand the conversation back to the assistant
      description: For an integration whose team is done with a conversation, such as a Discord bot's "resume AI" command. Ends the open ticket's escalation so the assistant replies again; the ticket stays open, so use /ticket/close to close it as well. This is the chat-key counterpart of PATCH /tickets/{id} with escalated false, which only the dashboard and the admin key can call. A conversation nobody took over is returned unchanged, and repeating the call changes nothing. No body. The change is not sent to the bot's webhook.
      security:
        - ChatKey: []
      responses:
        '200':
          description: The conversation, no longer escalated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/handoff:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: handOffChatConversation
      summary: Hand the conversation to the team after the customer confirms
      description: Call it when the customer accepts the handoff a reply offered (status handoff_offered), or from your own "contact the team" button. Flags the conversation for the support team and adds the assistant's confirmation to it. The dashboard lists the conversation under the assistant's handoffs, or marks its open ticket handed off. The assistant keeps replying; to stop it, use escalate. Repeating the call, or calling it while a person has the conversation, changes nothing. No body.
      security:
        - ChatKey: []
      responses:
        '200':
          description: The conversation, with status handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConversation'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/ticket:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: openChatTicket
      summary: List the conversation on the dashboard's Tickets page
      description: For an integration with its own tickets, such as a Discord bot that opens a ticket channel. Opens a ticket for the conversation without escalating it, so the assistant keeps replying while your team can follow, reply and escalate from the dashboard. A conversation that already has an open ticket returns it unchanged. The body is optional.
      security:
        - ChatKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                subject:
                  type: string
                  maxLength: 200
                  description: Defaults to the conversation's first message, or "Customer conversation" before it has one.
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                keep_open:
                  type: boolean
                  description: True stops a new ticket closing on its own (v2).
      responses:
        '200':
          description: The conversation's open ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTicket'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/ticket/close:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: closeChatTicket
      summary: Close the conversation's ticket
      description: For an integration that closed its own ticket, such as a Discord bot closing a ticket channel. Closes the conversation's open ticket and ends its escalation, so the assistant answers the conversation again, and clears its handoff flag. Without an open ticket, the conversation's latest ticket is returned unchanged, so retries are safe; a conversation that never had a ticket returns 404 TICKET_NOT_FOUND. No body. The change is not sent to the bot's webhook.
      security:
        - ChatKey: []
      responses:
        '200':
          description: The closed ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTicket'
        default:
          $ref: '#/components/responses/Error'
  /conversations/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
    post:
      operationId: addPlatformReply
      summary: Record a reply a person wrote on the integration's platform
      description: For a reply someone on your team wrote on your platform, such as a moderator in a Discord ticket channel, so the dashboard shows the whole conversation. It is stored as an assistant message with author agent, which later replies take as history, and answers the conversation's open ticket - one is opened (not escalated) when there is none. The assistant keeps replying unless escalate is true, which escalates the ticket like /escalate. A repeated external_id returns the stored reply with 200 and changes nothing. These replies are not sent to the bot's webhook.
      security:
        - ChatKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
                author:
                  type: string
                  maxLength: 64
                  description: The person's name, shown in the dashboard and returned as agent.
                external_id:
                  type: string
                  maxLength: 128
                  description: The platform's ID for the message, which makes retries safe.
                escalate:
                  type: boolean
                  default: false
                  description: Also take the conversation over from the assistant.
      responses:
        '201':
          description: The reply was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPlatformReply'
        '200':
          description: A reply with this external_id was already stored; it is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPlatformReply'
        default:
          $ref: '#/components/responses/Error'
  /channel-types:
    get:
      operationId: listChannelTypes
      summary: The channel types the bot may add channels of (v2)
      description: Needs channels.read. The platform's active types, its upcoming types (offered false, upcoming true; show them as Upcoming and don't offer them), plus a hidden type one of the bot's channels still uses (offered false). Channels already of an upcoming or hidden type keep working.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Types, in the platform's order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferedChannelType'
        default:
          $ref: '#/components/responses/Error'
  /customers:
    get:
      operationId: listCustomers
      summary: The bot's customers (v2)
      description: Needs customers.read. Most recently seen first; deleted customers are left out.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Matches the start of the name or of any contact's value.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: The next_cursor of the previous page.
      responses:
        '200':
          description: A page of customers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  next_cursor:
                    type: string
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCustomer
      summary: Add a customer (v2)
      description: Needs customers.write. A name or at least one contact. 409 CUSTOMER_EXISTS when another customer of the bot already has one of the contacts.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: The new customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomerID'
    get:
      operationId: getCustomer
      summary: A customer with their latest conversations and tickets (v2)
      description: Needs customers.read. Lists the latest 10 conversations and tickets; GET /tickets?customer= lists all tickets. 404 CUSTOMER_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Customer'
                  - type: object
                    required: [recent_conversations, recent_tickets]
                    properties:
                      recent_conversations:
                        type: array
                        items:
                          type: object
                          required: [id, created_at, updated_at]
                          properties:
                            id:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                      recent_tickets:
                        type: array
                        items:
                          type: object
                          required: [id, subject, status, created_at, updated_at]
                          properties:
                            id:
                              type: string
                            subject:
                              type: string
                            status:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCustomer
      summary: Change a customer (v2)
      description: Needs customers.write. Fields left out keep their value. contacts, when sent, replaces all of the customer's contacts (an empty list removes them); metadata replaces the stored object.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CustomerInput'
                - type: object
                  minProperties: 1
      responses:
        '200':
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCustomer
      summary: Delete a customer (v2)
      description: Needs customers.write. Deletes the customer and their contacts. Their conversations and tickets keep customer_id, and the contacts can be used again.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /channels:
    get:
      operationId: listChannels
      summary: The bot's channels (v2)
      description: Needs channels.read. Oldest first; deleted channels are left out.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChannel
      summary: Add a channel to the bot (v2)
      description: Needs channels.write. 400 CHANNEL_TYPE_NOT_ALLOWED for a type that isn't offered; 409 CHANNEL_EXISTS for a name the bot already uses.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ChannelInput'
                - type: object
                  required: [type, name]
      responses:
        '201':
          description: The new channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
  /channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ChannelID'
    get:
      operationId: getChannel
      summary: One of the bot's channels (v2)
      description: Needs channels.read. 404 CHANNEL_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChannel
      summary: Change a channel, or turn it off (v2)
      description: Needs channels.write. Moving it to another type needs that type to be offered (400 CHANNEL_TYPE_NOT_ALLOWED); a channel can keep a type that is now upcoming or hidden. enabled false stops the chat API keys bound to it at once; it can't undo a platform admin's disabled_by_platform.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ChannelInput'
                - type: object
                  minProperties: 1
      responses:
        '200':
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteChannel
      summary: Delete a channel (v2)
      description: Needs channels.write. Its conversations and tickets keep channel_id and still show its name. 409 CHANNEL_IN_USE while active chat API keys are bound to it.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /workspace:
    get:
      operationId: getWorkspace
      summary: The workspace name and bot configuration, with saved versions and defaults
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The workspace; revision is 0 until it is first saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveWorkspace
      summary: Save the workspace name and bot configuration
      description: revision must be the one loaded; otherwise 409 WORKSPACE_CONFLICT. A changed bot is added to history (the latest 30 are kept).
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, bot, revision]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                bot:
                  $ref: '#/components/schemas/Bot'
                revision:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: The saved workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Error'
  /knowledge/documents:
    get:
      operationId: listKnowledgeDocuments
      summary: List knowledge documents, newest first
      description: Uploads never processed within an hour are marked failed first.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Matches titles and file names.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_upload, processing, indexed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: next_cursor from the previous page.
      responses:
        '200':
          description: One page of documents with totals.
          content:
            application/json:
              schema:
                type: object
                required: [data, total, counts, max_documents, max_file_bytes, accept]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeDocument'
                  next_cursor:
                    type: string
                  total:
                    type: integer
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Documents per status.
                  max_documents:
                    type: integer
                  max_file_bytes:
                    type: integer
                  accept:
                    type: string
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createKnowledgeArticle
      summary: Add an article and index it
      description: title and content are required. The same text already in the knowledge base returns 409 DUPLICATE_DOCUMENT with the existing document's document_id; a full knowledge base returns 409 KNOWLEDGE_BASE_FULL.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: The indexed article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        default:
          $ref: '#/components/responses/Error'
  /knowledge/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: getKnowledgeDocument
      summary: A document with its Markdown text
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The document, including content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateKnowledgeDocument
      summary: Rename a document or replace its text, then index it again
      description: Applies only the fields sent; without title the document keeps its own.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: The updated document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteKnowledgeDocument
      summary: Delete a document with its passages, embeddings, and files
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /knowledge/documents/{id}/process:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: processKnowledgeDocument
      summary: Read, split, and embed a document for up to about 40 seconds
      description: Call again while status is processing; each call resumes where the last stopped. A document another request is processing is returned unchanged.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The document with its progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        default:
          $ref: '#/components/responses/Error'
  /knowledge/documents/{id}/reindex:
    parameters:
      - $ref: '#/components/parameters/DocumentID'
    post:
      operationId: reindexKnowledgeDocument
      summary: Rebuild a document's passages and embeddings
      security:
        - AdminKey: []
        - MemberToken: []
      description: Re-chunks the text and embeds only chunks whose content or metadata changed; unchanged chunks keep their vectors and removed ones are deleted.
      parameters:
        - name: extract
          in: query
          schema:
            type: boolean
          description: Read the uploaded file again instead of the stored text.
        - name: force
          in: query
          schema:
            type: boolean
          description: Embed every chunk again, even unchanged ones.
      responses:
        '200':
          description: The document with its progress; call process while it is processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocument'
        default:
          $ref: '#/components/responses/Error'
  /knowledge/uploads:
    post:
      operationId: createKnowledgeUpload
      summary: Register a file and get a presigned URL to upload it to R2
      description: PUT the file to url with exactly headers within 15 minutes, then call process. A title and metadata sent here (such as from a KB manifest) are stored before the file is read, so it is embedded once with them. Registering the same unfinished upload again returns a fresh URL and applies the title and metadata sent with it; a file already in the knowledge base returns 409 DUPLICATE_DOCUMENT with the existing document's document_id.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, size, sha256]
              properties:
                filename:
                  type: string
                  maxLength: 260
                  description: Ends in .md, .markdown, .txt, .text, .csv, .json, .html, .htm, .pdf, or .docx.
                size:
                  type: integer
                  minimum: 1
                  description: Bytes; at most 5 MB for text formats and KB_MAX_FILE_BYTES for HTML, PDF, and Word.
                sha256:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Kept when the file is read, unless it equals the title derived from the file name; without it the title comes from the file.
                source_url:
                  type: string
                  maxLength: 2000
                  description: An http(s) link cited with answers.
                knowledge_base_id:
                  type: string
                  maxLength: 64
                  description: Filter metadata stored with the document's vectors. The same applies to locale, product and version.
                locale:
                  type: string
                  maxLength: 64
                product:
                  type: string
                  maxLength: 64
                version:
                  type: string
                  maxLength: 64
      responses:
        '201':
          description: Where to upload the file.
          content:
            application/json:
              schema:
                type: object
                required: [document, url, method, headers, expires_at]
                properties:
                  document:
                    $ref: '#/components/schemas/KnowledgeDocument'
                  url:
                    type: string
                  method:
                    type: string
                    enum: [PUT]
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /knowledge/search:
    post:
      operationId: searchKnowledge
      summary: Run retrieval for a query and report every candidate's scores
      description: Runs the full retrieval pipeline for the admin's bot without the cache, and returns the debug trace.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 4000
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 4
                filters:
                  $ref: '#/components/schemas/RetrievalFilters'
      responses:
        '200':
          description: The passages that would be sent, and every candidate.
          content:
            application/json:
              schema:
                type: object
                required: [result, hits, trace]
                properties:
                  trace:
                    $ref: '#/components/schemas/RetrievalTrace'
                  result:
                    type: object
                    required: [passages, sources, context_tokens]
                    properties:
                      query:
                        type: string
                        description: What was searched.
                      confidence:
                        type: string
                        enum: [high, low, none]
                        description: high when passages matched on their own merits, low when only the closest were found, none when nothing usable was.
                      candidates:
                        type: integer
                      passages:
                        type: array
                        items:
                          $ref: '#/components/schemas/Passage'
                      sources:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeSource'
                      context_tokens:
                        type: integer
                      degraded:
                        type: array
                        description: Retrieval stages that failed and were skipped (rewrite, dense, lexical, rerank).
                        items:
                          type: string
                      fallback:
                        type: boolean
                        description: True when no passage matched the query closely, so the closest passages were selected instead.
                  hits:
                    type: array
                    description: Every candidate, in final ranking order.
                    items:
                      type: object
                      required: [id, document_id, title, position, content, fused_score, selected]
                      properties:
                        id:
                          type: string
                          description: The chunk's vector ID.
                        document_id:
                          type: string
                        title:
                          type: string
                        heading:
                          type: string
                        position:
                          type: integer
                        content:
                          type: string
                        keyword_rank:
                          type: integer
                        vector_rank:
                          type: integer
                        vector_score:
                          type: number
                        fused_score:
                          type: number
                        rerank_score:
                          type: number
                        selected:
                          type: boolean
        default:
          $ref: '#/components/responses/Error'
  /usage/summary:
    get:
      operationId: getUsageSummary
      summary: Model usage and tool call totals for a date range
      description: Totals, one entry per UTC day (including days without usage), the top models, tool call totals, and how the admin's bot answered (rag). estimated_cost is what the business is billed in USD, what OpenRouter reported charging plus the model's fee and commission when the reply was made; replies recorded before cost tracking count as 0. Tool calls include tests from the Tools page.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: to
          in: query
          description: Last day (UTC), inclusive. Defaults to today.
          schema:
            type: string
            format: date
        - name: from
          in: query
          description: First day (UTC), inclusive. Defaults to 29 days before to. The range covers at most 366 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Usage summary.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, requests, input_tokens, output_tokens, total_tokens, estimated_cost, avg_latency_ms, by_day, by_model, tool_calls]
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  requests:
                    type: integer
                    description: Model replies.
                  input_tokens:
                    type: integer
                  output_tokens:
                    type: integer
                  total_tokens:
                    type: integer
                  estimated_cost:
                    type: number
                  avg_latency_ms:
                    type: integer
                    description: Average reply time, including tool calls; 0 without replies.
                  by_day:
                    type: array
                    items:
                      type: object
                      required: [date, requests, input_tokens, output_tokens, total_tokens, estimated_cost]
                      properties:
                        date:
                          type: string
                          format: date
                        requests:
                          type: integer
                        input_tokens:
                          type: integer
                        output_tokens:
                          type: integer
                        total_tokens:
                          type: integer
                        estimated_cost:
                          type: number
                  by_model:
                    type: array
                    description: Up to 5 models with the most replies.
                    items:
                      type: object
                      required: [model, requests, total_tokens, estimated_cost, avg_latency_ms]
                      properties:
                        model:
                          type: string
                        requests:
                          type: integer
                        total_tokens:
                          type: integer
                        estimated_cost:
                          type: number
                        avg_latency_ms:
                          type: integer
                  tool_calls:
                    type: object
                    required: [total, errors, avg_latency_ms, by_tool]
                    description: Totals cover every tool; by_tool lists up to 5 with the most calls.
                    properties:
                      total:
                        type: integer
                      errors:
                        type: integer
                        description: Calls whose status was error.
                      avg_latency_ms:
                        type: integer
                      by_tool:
                        type: array
                        items:
                          type: object
                          required: [name, calls, errors, avg_latency_ms]
                          properties:
                            name:
                              type: string
                            calls:
                              type: integer
                            errors:
                              type: integer
                            avg_latency_ms:
                              type: integer
                  rag:
                    type: object
                    description: Answers of the admin's bot in the range; rates are shares of requests from 0 to 1.
                    properties:
                      requests:
                        type: integer
                      no_answer_rate:
                        type: number
                      handoff_rate:
                        type: number
                      clarification_rate:
                        type: number
                      cache_hit_rate:
                        type: number
                      rewrite_rate:
                        type: number
                      degraded_rate:
                        type: number
                      avg_latency_ms:
                        type: integer
                      avg_retrieval_ms:
                        type: integer
        default:
          $ref: '#/components/responses/Error'
  /stats/support:
    get:
      operationId: getSupportStats
      summary: Conversations, tickets, response times and AI cost per ticket for a date range (v2)
      description: How the bot, or the whole business with scope=business, handled its customers. Conversations are chat API conversations started in the range; tickets were opened or closed in it. The backlog is the open tickets now, whatever the range. Costs are what the business is billed in USD, OpenRouter's cost plus each model's fee and commission; a ticket's cost is its linked conversation's AI cost.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: to
          in: query
          description: Last day (UTC), inclusive. Defaults to today.
          schema:
            type: string
            format: date
        - name: from
          in: query
          description: First day (UTC), inclusive. Defaults to 29 days before to. The range covers at most 366 days.
          schema:
            type: string
            format: date
        - name: scope
          in: query
          description: bot (the default) counts the requesting bot; business counts every bot of its business.
          schema:
            type: string
            enum: [bot, business]
      responses:
        '200':
          description: Support statistics.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, scope, conversations, tickets, backlog, first_response, resolution, cost, by_day]
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  scope:
                    type: string
                    enum: [bot, business]
                  conversations:
                    type: object
                    required: [total, ai_only, handed_off, escalated, deflection_rate]
                    properties:
                      total:
                        type: integer
                      ai_only:
                        type: integer
                        description: Ended without a ticket or a handoff.
                      handed_off:
                        type: integer
                      escalated:
                        type: integer
                      deflection_rate:
                        type: number
                        description: ai_only's share of total, from 0 to 1.
                  tickets:
                    type: object
                    required: [created, closed, from_customer, reopened, reopen_rate]
                    properties:
                      created:
                        type: integer
                      closed:
                        type: integer
                      from_customer:
                        type: integer
                        description: Opened through the chat API.
                      reopened:
                        type: integer
                      reopen_rate:
                        type: number
                  backlog:
                    type: object
                    required: [total, overdue, unassigned, by_status, by_priority]
                    properties:
                      total:
                        type: integer
                      overdue:
                        type: integer
                      unassigned:
                        type: integer
                      by_status:
                        type: object
                        additionalProperties:
                          type: integer
                      by_priority:
                        type: object
                        additionalProperties:
                          type: integer
                  first_response:
                    description: Time from a ticket's creation to a person's first reply, for tickets opened in the range.
                    type: object
                    required: [count, avg_seconds, median_seconds, p90_seconds]
                    properties:
                      count:
                        type: integer
                      avg_seconds:
                        type: number
                      median_seconds:
                        type: number
                      p90_seconds:
                        type: number
                  resolution:
                    description: Time from a ticket's creation to its closing, for tickets closed in the range.
                    type: object
                    required: [count, avg_seconds, median_seconds, p90_seconds]
                    properties:
                      count:
                        type: integer
                      avg_seconds:
                        type: number
                      median_seconds:
                        type: number
                      p90_seconds:
                        type: number
                  cost:
                    type: object
                    required: [total, per_ticket, per_conversation, per_ai_resolved]
                    properties:
                      total:
                        type: number
                        description: Every model reply in the range, in USD.
                      per_ticket:
                        type: number
                        description: The average AI cost of a ticket's conversation, over tickets with one opened in the range.
                      per_conversation:
                        type: number
                      per_ai_resolved:
                        type: number
                        description: The average over conversations the assistant handled alone.
                  by_day:
                    type: array
                    items:
                      type: object
                      required: [date, conversations, tickets_created, tickets_closed, ticket_cost]
                      properties:
                        date:
                          type: string
                          format: date
                        conversations:
                          type: integer
                        tickets_created:
                          type: integer
                        tickets_closed:
                          type: integer
                        ticket_cost:
                          type: number
                          description: The AI cost of the tickets opened that day.
        default:
          $ref: '#/components/responses/Error'
  /stats/performance:
    get:
      operationId: getPerformanceStats
      summary: Requests, latency, reply pipeline stages and RAG quality for a date range (v2)
      description: How the API performed for the bot, or the whole business with scope=business. Counts and latency of the HTTP requests it served (stored when the server runs with PERF_HTTP_STATS; see recording), where a reply's time went stage by stage, how well retrieval worked, and each model's call latency and failures. Percentiles are nearest-rank, in whole milliseconds. Read recording first; when recording.http is false, requests and latency are all zero.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: to
          in: query
          description: Last day (UTC), inclusive. Defaults to today.
          schema:
            type: string
            format: date
        - name: from
          in: query
          description: First day (UTC), inclusive. Defaults to 29 days before to. The range covers at most 366 days.
          schema:
            type: string
            format: date
        - name: scope
          in: query
          description: bot (the default) covers the requesting bot; business covers every bot of its business.
          schema:
            type: string
            enum: [bot, business]
      responses:
        '200':
          description: Performance statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceStats'
        default:
          $ref: '#/components/responses/Error'
  /bots/{id}/avatar:
    put:
      operationId: setBotAvatar
      summary: Set a bot's picture
      description: Needs bot.write. 404 BOT_NOT_FOUND for a bot of another business. Send a PNG, JPEG or WebP image of 16-4096 pixels per side, as multipart/form-data in a field named file or as the raw body with an image content type. The type is read from the bytes, never trusted; SVG is refused. The image is stored in the public bucket and replaces the previous one. Answers 503 NOT_CONFIGURED when the server has no public bucket.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ScopeID'
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The picture's public URL.
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties:
                  avatar_url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeBotAvatar
      summary: Remove a bot's picture
      description: Needs bot.write. 404 BOT_NOT_FOUND for a bot of another business. The file is deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ScopeID'
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The picture is gone.
