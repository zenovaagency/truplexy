            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties:
                  avatar_url:
                    type: 'null'
        default:
          $ref: '#/components/responses/Error'
  /bots:
    get:
      operationId: listBots
      summary: List bots
      description: A member sees their business's bots (bot.read); the admin key sees every tenant's.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Bots, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantBot'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBot
      summary: Create a bot
      description: Needs bots.create. A member's bot belongs to their business and counts against its plan (403 PLAN_LIMIT_REACHED); tenant_id may be left out, and must be theirs if sent. The admin key names any tenant, which is created when new. A bot starts from its business type's assistant.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bot_id, name]
              properties:
                tenant_id:
                  $ref: '#/components/schemas/ScopeID'
                bot_id:
                  $ref: '#/components/schemas/ScopeID'
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: The bot, with the default configuration and an empty knowledge base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBot'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api-keys:
    get:
      operationId: listAPIKeys
      summary: List chat API keys without their secrets
      description: A member sees their business's keys (integrations.read); the admin key sees every tenant's.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Keys, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAPIKey
      summary: Issue a chat API key for one bot
      description: Needs integrations.write. The key is returned once; only its SHA-256 is stored. It reaches only its bot's conversations and knowledge. A member's key is for a bot of their business, and tenant_id may be left out.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bot_id, name]
              properties:
                tenant_id:
                  $ref: '#/components/schemas/ScopeID'
                bot_id:
                  $ref: '#/components/schemas/ScopeID'
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                channel_id:
                  type: string
                  pattern: '^chn_[0-9a-f]{32}$'
                  description: Binds the key to one of the bot's channels (v2), marking its conversations and their tickets; the key stops working while the channel is off. 404 CHANNEL_NOT_FOUND.
      responses:
        '201':
          description: The key, including its secret this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^key_[0-9a-f]{32}$'
    delete:
      operationId: revokeAPIKey
      summary: Revoke a chat API key
      description: Needs integrations.write; a member revokes only their business's keys. This instance stops accepting it at once; others within a minute.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Revoked.
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tickets:
    get:
      operationId: listTickets
      summary: List the bot's tickets, most recently updated first
      description: Also returns the size of each view. Pass next_cursor as cursor for the next page.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [needs_reply, mine, escalated, open, all]
            default: all
          description: needs_reply is open tickets whose customer wrote after the last reply; mine is the signed-in member's open tickets (v2); escalated is open escalated tickets; open is every open ticket.
        - name: flag
          in: query
          schema:
            type: string
            enum: [needs_reply, escalated, handed_off, unassigned, overdue, reopened]
          description: Keeps tickets with this flag set (v2).
        - name: assignee
          in: query
          schema:
            type: string
          description: me, none, or a member's user ID (v2).
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Matches the subject, or a ticket or conversation ID exactly.
        - name: channel
          in: query
          schema:
            type: string
          description: A channel ID, or none for tickets without one (v2).
        - name: channel_type
          in: query
          schema:
            type: string
          description: A channel type id, such as discord (v2).
        - name: customer
          in: query
          schema:
            type: string
            pattern: '^cus_[0-9a-f]{32}$'
          description: Keeps tickets from this customer (v2).
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of tickets.
          content:
            application/json:
              schema:
                type: object
                required: [data, counts]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  counts:
                    type: object
                    required: [needs_reply, escalated, open, all]
                    properties:
                      needs_reply:
                        type: integer
                      escalated:
                        type: integer
                      open:
                        type: integer
                      all:
                        type: integer
                  next_cursor:
                    type: string
                    description: Absent on the last page.
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTicket
      summary: Open a ticket, optionally for a conversation
      description: A conversation has at most one open ticket; a second returns 409 TICKET_EXISTS. A ticket for a conversation takes its title as the subject unless one is given, and clears the assistant's handoff flag on it.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                conversation_id:
                  type: string
                  pattern: '^conv_[0-9a-f]{32}$'
                  description: A conversation of the bot, from the chat API or the playground.
                subject:
                  type: string
                  maxLength: 200
                  description: Required without conversation_id.
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                escalated:
                  type: boolean
                  description: Hand the conversation to a person at once.
                channel_id:
                  type: string
                  pattern: '^chn_[0-9a-f]{32}$'
                  description: One of the bot's channels (v2); with conversation_id, defaults to the conversation's. 404 CHANNEL_NOT_FOUND.
                keep_open:
                  type: boolean
                  description: True stops the ticket closing on its own (v2).
      responses:
        '201':
          description: The new ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        default:
          $ref: '#/components/responses/Error'
  /tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    get:
      operationId: getTicket
      summary: A ticket with its conversation's latest 200 messages and its replies and notes
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTicket
      summary: Change a ticket's subject, status, priority, assignee or escalation
      description: Closing a ticket ends its escalation, so the assistant answers the conversation again. Escalating a closed ticket reopens it; reopening one beside another open ticket for the conversation returns 409 TICKET_EXISTS.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                subject:
                  type: string
                  minLength: 1
                  maxLength: 200
                status:
                  $ref: '#/components/schemas/TicketStatus'
                priority:
                  $ref: '#/components/schemas/TicketPriority'
                assignee:
                  type: string
                  maxLength: 64
                  description: Empty to unassign.
                escalated:
                  type: boolean
                channel_id:
                  type: string
                  description: One of the bot's channels, or empty to clear it (v2). 404 CHANNEL_NOT_FOUND.
                keep_open:
                  type: boolean
                  description: True stops the ticket closing on its own; false lets it again (v2).
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTicket
      summary: Delete a ticket with its replies and notes
      description: The conversation keeps its messages, including replies already sent to the customer. Deleting an escalated ticket hands the conversation back to the assistant.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /tickets/{id}/replies:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    post:
      operationId: replyToTicket
      summary: Reply to the customer, or add an internal note
      description: A reply to a ticket with a conversation is added to the conversation as an assistant message with author agent, which the chat API returns and later replies take as history. A note is seen only in the dashboard.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                kind:
                  type: string
                  enum: [reply, note]
                  default: reply
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
                status:
                  $ref: '#/components/schemas/TicketStatus'
                author:
                  type: string
                  maxLength: 64
                  description: Who wrote it; the dashboard sets the signed-in user.
      responses:
        '201':
          description: The reply and the updated ticket.
          content:
            application/json:
              schema:
                type: object
                required: [reply, ticket]
                properties:
                  reply:
                    $ref: '#/components/schemas/TicketReply'
                  ticket:
                    $ref: '#/components/schemas/Ticket'
        default:
          $ref: '#/components/responses/Error'
  /tickets/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/TicketID'
    post:
      operationId: summarizeTicket
      summary: Generate the ticket's AI summary for the person taking it over (v2)
      description: >-
        Summarizes the ticket's conversation and internal notes in a few short bullets (the issue, details given, what was tried or answered,
        what is still open) and stores it on the ticket as summary, with summary_at. Nothing is generated until someone calls this; calling it
        again replaces the summary, and a failure keeps the previous one. It is billed like an AI reply: its tokens count toward the month's
        tokens and the balance, and it counts as one reply toward replies_per_month. It doesn't change updated_at. Errors: 400 NO_CONVERSATION
        for a ticket without a conversation, 404 TICKET_NOT_FOUND, 429 PLAN_LIMIT_REACHED or LLM_RATE_LIMITED, 502 LLM_PROVIDER_ERROR,
        503 LLM_NOT_CONFIGURED, 504 LLM_TIMEOUT.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The ticket with its new summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        default:
          $ref: '#/components/responses/Error'
  /handoffs:
    get:
      operationId: listHandoffs
      summary: Conversations the assistant flagged for the team that no open ticket covers
      description: The latest 50. The assistant keeps replying in them until a person takes one over by opening an escalated ticket.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The flagged conversations, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [conversation_id, channel, updated_at]
                      properties:
                        conversation_id:
                          type: string
                        channel:
                          type: string
                          enum: [api, playground]
                        title:
                          type: string
                        updated_at:
                          type: string
                          format: date-time
        default:
          $ref: '#/components/responses/Error'
  /webhook:
    get:
      operationId: getWebhook
      summary: The bot's webhook, without its secret
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The webhook and its last delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveWebhook
      summary: Set the webhook that tells the bot's integration about dashboard changes
      description: |-
        Each bot has one webhook. While it is enabled, the backend POSTs a WebhookEvent to it when a person replies from the dashboard in a chat API conversation (message.created, data MessageCreatedData), or the dashboard opens a ticket for such a conversation or changes its status or escalation (ticket.updated, data TicketUpdatedData). Replies recorded through POST /conversations/{id}/replies are not sent. Delivery happens before the dashboard's request returns and never fails it; each attempt waits 2.5 seconds, and after no response, a 429 or a 5xx the event is sent once more with the same X-Truplexy-Delivery. Redirects are not followed.

        Every delivery carries X-Truplexy-Event, X-Truplexy-Delivery (the event ID) and X-Truplexy-Signature, "t=<unix seconds>,v1=<hex>", where hex is the HMAC-SHA256 of "<t>.<raw body>" keyed with the secret.

        The first save creates the secret and returns it; later saves keep it. The URL must be https:// (http://localhost only with APP_ENV=development). Changing the URL forgets the last delivery.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2000
                enabled:
                  type: boolean
                  default: true
      callbacks:
        event:
          '{$request.body#/url}':
            post:
              summary: A reply or ticket change made in the dashboard
              parameters:
                - name: X-Truplexy-Event
                  in: header
                  required: true
                  schema:
                    type: string
                    enum: [message.created, ticket.updated, ping]
                - name: X-Truplexy-Delivery
                  in: header
                  required: true
                  description: The event ID; a retry repeats it.
                  schema:
                    type: string
                - name: X-Truplexy-Signature
                  in: header
                  required: true
                  description: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" keyed with the secret>.
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WebhookEvent'
              responses:
                '200':
                  description: Any 2xx within 2.5 seconds acknowledges the event.
      responses:
        '200':
          description: The saved webhook; secret is included only when it was just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWebhook
      summary: Remove the bot's webhook
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /webhook/secret:
    post:
      operationId: rotateWebhookSecret
      summary: Replace the webhook's signing secret
      description: Deliveries are signed with the new secret from then on. It is returned only here.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The webhook with its new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        default:
          $ref: '#/components/responses/Error'
  /webhook/test:
    post:
      operationId: testWebhook
      summary: Send a ping event to the webhook, even a disabled one
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: How the delivery went.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        default:
          $ref: '#/components/responses/Error'
  /webhook/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List events whose delivery failed and were queued for retry (v2)
      description: Needs the server's WEBHOOK_OUTBOX setting. Newest first, up to 100. An event is delivered at least once with the same id (X-Truplexy-Delivery) on every attempt, so a receiver that stores ids can ignore repeats.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, dead]
      responses:
        '200':
          description: The queued events, without their payloads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookQueuedEvent'
        default:
          $ref: '#/components/responses/Error'
  /webhook/deliveries/{id}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: Put a queued event back in line to be tried again (v2)
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The event will be sent at the next scheduled run, with its attempts reset.
        default:
          $ref: '#/components/responses/Error'
  /tools:
    get:
      operationId: listTools
      summary: List the tools by name
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: All tools.
          content:
            application/json:
              schema:
                type: object
                required: [data, database_configured]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tool'
                  database_configured:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createApiTool
      summary: Save a new API tool
      description: Rule violations return 400 INVALID_TOOL; a taken name returns 409 TOOL_EXISTS. Needs migrations/0002_api_tools.sql.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIToolInput'
      responses:
        '201':
          description: The saved tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        default:
          $ref: '#/components/responses/Error'
  /tools/{name}:
    parameters:
      - $ref: '#/components/parameters/ToolName'
    get:
      operationId: getTool
      summary: Describe one tool
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceApiTool
      summary: Replace an API tool; the body may rename it
      description: Unknown names return 404 TOOL_NOT_FOUND; a taken new name returns 409 TOOL_EXISTS.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIToolInput'
      responses:
        '200':
          description: The updated tool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteApiTool
      summary: Delete an API tool
      description: Past tool_runs rows remain. Unknown names return 404 TOOL_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /tools/{name}/test:
    parameters:
      - $ref: '#/components/parameters/ToolName'
    post:
      operationId: testTool
      summary: Run a tool for real with the given arguments
      description: Returns the record the model would receive and records it in tool_runs. A failing tool returns 200 with status error; an unavailable tool returns 400 TOOL_UNAVAILABLE.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                arguments:
                  type: object
                  description: The tool's arguments. Omit for none.
                  additionalProperties: true
      responses:
        '200':
          description: The tool call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCall'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      summary: The signed-in person and their businesses
      description: Records the person's email and name from their token, and returns their memberships with each business's bots, whether they are a platform admin, and the permissions of each role.
      security:
        - MemberToken: []
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
  /me/avatar:
    put:
      operationId: setMyAvatar
      summary: Set your own picture
      description: Any signed-in person, for themselves. Send a PNG, JPEG or WebP image of 16-4096 pixels per side, as multipart/form-data in a field named file or as the raw body with an image content type. The type is read from the bytes, never trusted; SVG is refused. The image is stored in the public bucket and replaces the previous one. Answers 503 NOT_CONFIGURED when the server has no public bucket.
      security:
        - MemberToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The picture's public URL.
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties:
                  avatar_url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMyAvatar
      summary: Remove your own picture
      description: Any signed-in person, for themselves. The file is deleted.
      security:
        - MemberToken: []
      responses:
        '200':
          description: The picture is gone.
          content:
            application/json:
              schema:
                type: object
                required: [avatar_url]
                properties:
                  avatar_url:
                    type: 'null'
        default:
          $ref: '#/components/responses/Error'
  /business-types:
    get:
      operationId: listBusinessTypes
      summary: The kinds of business a new one can start from
      security:
        - MemberToken: []
      responses:
        '200':
          description: Business types, ending with other.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessType'
        default:
          $ref: '#/components/responses/Error'
  /models:
    get:
      operationId: listModels
      summary: The models the bot may use (v2)
      description: The platform's active models (an empty list when it chooses them itself, with selection platform), plus a hidden model the bot already uses (offered false). Prices are what the business pays, OpenRouter's price plus the platform's fee and commission, shown only as the total; tier sorts models by OpenRouter's output price.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Models, in the platform's order.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferedModel'
                  selection:
                    type: string
                    enum: [platform, business]
                    description: platform when the platform chooses models; models is then empty.
        default:
          $ref: '#/components/responses/Error'
  /prompt-templates:
    get:
      operationId: listPromptTemplates
      summary: The system prompt templates the bot may use (v2)
      description: The active templates offered to the business's type, plus a hidden template the bot already uses (offered false).
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Templates, the default first.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferedTemplate'
        default:
          $ref: '#/components/responses/Error'
  /platform/models:
    get:
      operationId: listCatalogModels
      summary: Every model in the catalog, with the saved bots using each (v2)
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Models; bots counts saved bots, and for the default model also those using the default.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogModel'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCatalogModel
      summary: Offer a model (v2)
      description: For platform admins. Making it the default stops the previous default being one. Without input_price_per_mtok or output_price_per_mtok, the model is read from OpenRouter (https://openrouter.ai/api/v1/model/{id}) for its prices and any label, context_tokens, max_output_tokens, supports_tools and supports_vision not sent; 400 INVALID_REQUEST when OpenRouter has no such model, 502 PRICING_UNAVAILABLE when it can't be reached.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogModelInput'
      responses:
        '201':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModel'
        default:
          $ref: '#/components/responses/Error'
  /platform/models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The OpenRouter model ID, path-escaped (google%2Fgemini-3.1-flash-lite).
        schema:
          type: string
    patch:
      operationId: updateCatalogModel
      summary: Change, hide or retire a model (v2)
      description: For platform admins. Fields left out keep their value. A hidden model keeps serving the bots that use it; a retired model's bots answer with the default model. Models aren't deleted. 404 MODEL_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogModelInput'
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModel'
        default:
          $ref: '#/components/responses/Error'
  /platform/models/{id}/refresh-pricing:
    parameters:
      - name: id
        in: path
        required: true
        description: The OpenRouter model ID, path-escaped (openai%2Fgpt-4o).
        schema:
          type: string
    post:
      operationId: refreshCatalogModelPricing
      summary: Read a model's prices from OpenRouter again (v2)
      description: For platform admins. Stores OpenRouter's current input and output prices and pricing_synced_at; nothing else changes, and replies already made keep the cost they were billed. 400 INVALID_REQUEST when OpenRouter has no model with this ID, 404 MODEL_NOT_FOUND, 502 PRICING_UNAVAILABLE when OpenRouter can't be reached.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModel'
        default:
          $ref: '#/components/responses/Error'
  /platform/models/refresh-pricing:
    post:
      operationId: refreshAllCatalogModelPricing
      summary: Read every model's prices from OpenRouter again (v2)
      description: For platform admins. Refreshes every model that isn't retired. A model OpenRouter doesn't have, or couldn't return, keeps its prices and is listed in failed.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The refreshed models, and those that weren't.
          content:
            application/json:
              schema:
                type: object
                required: [models, failed]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogModel'
                  failed:
                    type: array
                    items:
                      type: object
                      required: [id, error]
                      properties:
                        id:
                          type: string
                        error:
                          type: string
        default:
          $ref: '#/components/responses/Error'
  /platform/settings:
    get:
      operationId: getPlatformSettings
      summary: Platform-wide settings, such as the vision model (v2)
      description: For platform admins. vision_model is the model that answers a message with pictures (image input) when the bot's own model can't read them.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePlatformSettings
      summary: Change the vision model (v2)
      description: For platform admins. A model in the catalog must have supports_vision and not be retired; one the catalog doesn't list is checked against OpenRouter's input modalities (400 INVALID_REQUEST when it can't read pictures, 502 PRICING_UNAVAILABLE when OpenRouter can't be reached). null removes the setting, so the server's LLM_VISION_MODEL applies again. Takes effect within a minute. Recorded in the activity log as settings.update.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vision_model]
              properties:
                vision_model:
                  type: string
                  nullable: true
                  description: An OpenRouter model ID, or null to use the server's LLM_VISION_MODEL again.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        default:
          $ref: '#/components/responses/Error'
  /platform/prompt-templates:
    get:
      operationId: listCatalogTemplates
      summary: Every prompt template, with the saved bots using each (v2)
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Templates; own_prompt_bots counts saved bots that still use the prompt they had before templates.
          content:
            application/json:
              schema:
                type: object
                required: [templates, own_prompt_bots]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogTemplate'
                  own_prompt_bots:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCatalogTemplate
      summary: Offer a prompt template (v2)
      description: For platform admins. name and body are required. Every {{key}} in the body must be a listed variable or business_name or assistant_name, and {{#key}}…{{/key}} sections must be closed without nesting.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogTemplateInput'
      responses:
        '201':
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTemplate'
        default:
          $ref: '#/components/responses/Error'
  /platform/prompt-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateCatalogTemplate
      summary: Change, hide or retire a prompt template (v2)
      description: For platform admins. Fields left out keep their value; a change to body or variables raises version. Bots using a retired template answer with their business type's template. 404 TEMPLATE_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogTemplateInput'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogTemplate'
        default:
          $ref: '#/components/responses/Error'
  /platform/channel-types:
    get:
      operationId: listPlatformChannelTypes
      summary: The channel type catalog (v2)
      description: Every type, with the number of businesses' live (not deleted) channels of it, by sort_order.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Types.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminChannelType'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChannelType
      summary: Add a channel type (v2)
      description: 409 CHANNEL_TYPE_EXISTS for an id in use. Recorded in the activity log under _platform as channel_type.create.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ChannelTypeInput'
                - type: object
                  required: [id, label]
                  properties:
                    id:
                      type: string
                      pattern: '^[a-z][a-z0-9_-]{1,31}$'
      responses:
        '201':
          description: The new type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChannelType'
        default:
          $ref: '#/components/responses/Error'
  /platform/channel-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
    patch:
      operationId: updateChannelType
      summary: Change or hide a channel type (v2)
      description: Types aren't deleted. An upcoming type is listed to businesses but can't be added (CHANNEL_TYPE_NOT_ALLOWED); a hidden type isn't listed or offered for new channels. In both, channels already of the type keep working. A new label or auto_close_hours shows at once in businesses' channels (type_label, effective_auto_close_hours). Recorded in the activity log under _platform as channel_type.update. 404 CHANNEL_TYPE_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelTypeInput'
      responses:
        '200':
          description: The updated type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChannelType'
        default:
          $ref: '#/components/responses/Error'
  /platform/channels:
    get:
      operationId: listPlatformChannels
      summary: Every business's channels (v2)
      description: Newest first, up to 500; deleted channels are left out. 400 INVALID_REQUEST for a tenant that isn't a business ID, a type that isn't a channel type id, or another status.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: tenant
          in: query
          schema:
            type: string
          description: A business ID.
        - name: type
          in: query
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{1,31}$'
          description: A channel type id.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
          description: disabled is turned off by its business or a platform admin.
      responses:
        '200':
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Channel'
                        - type: object
                          required: [tenant_name]
                          properties:
                            tenant_name:
                              type: string
        default:
          $ref: '#/components/responses/Error'
  /platform/channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ChannelID'
    patch:
      operationId: setPlatformChannelDisabled
      summary: Turn a business's channel off or back on (v2)
      description: A disabled channel stays listed for its business with disabled_by_platform true and active false, its chat API keys answer 403 CHANNEL_DISABLED, and the business can't turn it back on. disabled false makes it active again unless the business has it off too. Recorded in the business's activity log as channel.platform_disabled or channel.platform_enabled. 400 INVALID_REQUEST without disabled; 404 CHANNEL_NOT_FOUND for an unknown or deleted channel.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          $ref: '#/components/responses/Error'
  /platform/overview:
    get:
      operationId: getPlatformOverview
      summary: Counts across every business (v2)
      description: Businesses, people, bots, open tickets, and this month's replies and spend, with replies per day for the last 30 days. cost_this_month is what OpenRouter charged; billed_this_month adds each reply's fee and commission, what businesses were billed.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants/{id}/detail:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPlatformTenantDetail
      summary: A business's members, bots, open tickets and recent activity (v2)
      description: 404 TENANT_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /platform/users:
    get:
      operationId: listPlatformUsers
      summary: Everyone's accounts, with their businesses (v2)
      description: Most recently seen first.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: q
          in: query
          description: Matches email or name.
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          description: Default everyone not deleted.
          schema:
            type: string
            enum: [active, disabled, deleted, all]
        - name: platform_admin
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          description: next_cursor from the previous page.
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformUser'
                  next_cursor:
                    type: string
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPlatformUser
      summary: Create an account and invite the person (v2)
      description: Creates the account in Supabase Auth, which emails the person a link to set it up, and adds it to the businesses. 409 EMAIL_TAKEN; 404 TENANT_NOT_FOUND; 503 NOT_CONFIGURED without SUPABASE_SECRET_KEY; 502 AUTH_PROVIDER_ERROR.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 80
                platform_admin:
                  type: boolean
                memberships:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [tenant_id, role]
                    properties:
                      tenant_id:
                        $ref: '#/components/schemas/ScopeID'
                      role:
                        type: string
                        enum: [owner, admin, editor, agent, viewer]
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUserDetail'
        default:
          $ref: '#/components/responses/Error'
  /platform/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPlatformUser
      summary: One account and what its person did recently (v2)
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUserDetail'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePlatformUser
      summary: Rename, change email, grant or revoke platform admin, disable or enable an account (v2)
      description: Names and emails change in Supabase Auth too (503 NOT_CONFIGURED without SUPABASE_SECRET_KEY). Disabling locks the person out within 30 seconds on every server (403 ACCOUNT_DISABLED) and bans the account in Supabase. 409 OWN_ACCESS for your own account; 409 LAST_PLATFORM_ADMIN; 409 EMAIL_TAKEN; 404 USER_NOT_FOUND. Recorded in the activity log.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  maxLength: 80
                email:
                  type: string
                  format: email
                platform_admin:
                  type: boolean
                disabled:
                  type: boolean
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUserDetail'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePlatformUser
      summary: Delete an account (v2)
      description: Deletes it in Supabase Auth, takes the person out of every business, unassigns their open tickets and revokes invitations to their address; only the ID is kept. 409 SOLE_OWNER (with tenants) for the only owner of a business; 409 OWN_ACCESS; 409 LAST_PLATFORM_ADMIN; 404 USER_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /platform/tickets:
    get:
      operationId: listPlatformTickets
      summary: Tickets across every business (v2)
      description: Read only, most recently updated first, 100 a page; pass next_before as before for the next.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: tenant
          in: query
          schema:
            type: string
        - name: view
          in: query
          schema:
            type: string
            enum: [all, open, needs_reply, escalated]
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: channel_type
          in: query
          schema:
            type: string
          description: Keeps tickets from channels of this type; each row has channel_id, channel_name and channel_type.
        - name: before
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /platform/tools:
    get:
      operationId: listPlatformTools
      summary: Every business's API tools with their calls in the last 30 days (v2)
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: tenant
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /platform/tools/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: setPlatformToolDisabled
      summary: Turn a business's tool off or back on (v2)
      description: A tool turned off stays listed for its business, unavailable, and its bots can't call it. Recorded in the business's activity log. 404 TOOL_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /platform/usage:
    get:
      operationId: getPlatformUsage
      summary: Model usage across every business (v2)
      description: Requests, tokens (including cached prompt tokens), spend (estimated_cost, what OpenRouter charged, and billed_cost, with each reply's fee and commission) and average reply time from from to to (UTC dates, default the last 30 days), grouped by business, model or day.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: group
          in: query
          schema:
            type: string
            enum: [tenant, model, day]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /platform/performance:
    get:
      operationId: getPlatformPerformance
      summary: Requests, latency, reply pipeline stages and RAG quality across every business (v2)
      description: The same body as getPerformanceStats, covering every business and the requests no business could be identified for, with scope platform. Adds tenants, the businesses with the most requests. Takes no scope.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: to
          in: query
          description: Last day (UTC), inclusive. Defaults to today.
          schema:
            type: string
            format: date
        - name: from
          in: query
          description: First day (UTC), inclusive. Defaults to 29 days before to. The range covers at most 366 days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Performance statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceStats'
        default:
          $ref: '#/components/responses/Error'
  /profile:
    get:
      operationId: getChatProfile
      summary: The business and bot names and pictures (v2)
      description: For a widget's header. Returns only names and public picture URLs of the key's own business and bot. bot.name is the name saved in the bot's configuration. Cacheable for 60 seconds.
      security:
        - ChatKey: []
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                type: object
                required: [business, bot]
                properties:
                  business:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      logo_url:
                        type: string
                        format: uri
                  bot:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      avatar_url:
                        type: string
                        format: uri
                  attachments:
                    allOf:
                      - $ref: '#/components/schemas/AttachmentConfig'
                    description: Image input. Absent when the server has it off. A widget shows an attach button only when enabled is true; the reason is not revealed to customers.
        default:
          $ref: '#/components/responses/Error'
  /customer:
    put:
      operationId: identifyChatCustomer
      summary: Find or create the customer your platform knows (v2)
      description: Finds the bot's customer who has any of the contacts sent, adds the contacts they lack, updates the name and metadata sent and marks them seen; if there is none, creates one. Pass the returned id as customer_id to POST /conversations. Send at least one contact. 409 CUSTOMER_CONFLICT when the contacts belong to different customers (nothing is changed); 409 CUSTOMER_EXISTS when another customer took a contact while the request ran.
      security:
        - ChatKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: An existing customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '201':
          description: A new customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Error'
  /realtime/token:
    post:
      operationId: getRealtimeTopics
      summary: Where to listen for live events (v2)
      description: Subscribe to the returned topics with Supabase Realtime (broadcast) using url and publishable_key. Each event's payload is {id, type, created_at, data}, data as in the matching webhook event. 503 REALTIME_NOT_CONFIGURED when the server has no live updates.
      security:
        - ChatKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                conversation_id:
                  type: string
                  pattern: '^conv_[0-9a-f]{32}$'
      responses:
        '200':
          description: The topics.
          content:
            application/json:
              schema:
                type: object
                required: [url, publishable_key, events]
                properties:
                  url:
                    type: string
                    description: The Supabase project to connect to.
                  publishable_key:
                    type: string
                    description: The key subscribers connect with.
                  bot_topic:
                    type: string
                    description: Every event of the bot.
                  conversation_topic:
                    type: string
                    description: One conversation's messages and ticket changes, never notes; safe for that customer's browser.
                  events:
                    type: array
                    items:
                      type: string
                      enum: [message.created, ticket.created, ticket.updated, conversation.updated]
        default:
          $ref: '#/components/responses/Error'
  /realtime:
    get:
      operationId: getDashboardRealtime
      summary: Where the bot's live ticket events are published, for the dashboard (v2)
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The bot's topic.
          content:
            application/json:
              schema:
                type: object
                required: [url, publishable_key, events]
                properties:
                  url:
                    type: string
                    description: The Supabase project to connect to.
                  publishable_key:
                    type: string
                    description: The key subscribers connect with.
                  bot_topic:
                    type: string
                    description: Every event of the bot.
                  conversation_topic:
                    type: string
                    description: One conversation's messages and ticket changes, never notes; safe for that customer's browser.
                  events:
                    type: array
                    items:
                      type: string
                      enum: [message.created, ticket.created, ticket.updated, conversation.updated]
        default:
          $ref: '#/components/responses/Error'
  /billing:
    get:
      operationId: getBilling
      summary: The balance, this month's tokens and the extra-token slider (v2)
      description: usage.read. Each plan includes tokens_per_month; Starter and Pro sell extra tokens for the month. The balance (USD, credited by platform admins) pays for extra tokens and for replies past the month's tokens at their billed cost.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
        default:
          $ref: '#/components/responses/Error'
  /billing/ledger:
    get:
      operationId: listBalanceLedger
      summary: Changes to the balance, newest first (v2)
      description: usage.read. 50 per page; pass next_before as before for the next page.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: before
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BalanceEntry'
                  next_before:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /billing/token-addons/quote:
    get:
      operationId: quoteTokenAddon
      summary: Price extra tokens for the slider (v2)
      description: usage.read. 400 INVALID_REQUEST when millions is missing or off the slider, 400 ADDON_NOT_AVAILABLE when the plan sells none or the business's tokens are unlimited.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: millions
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The price, tier by tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenQuote'
        default:
          $ref: '#/components/responses/Error'
  /billing/token-addons:
    post:
      operationId: buyTokenAddon
      summary: Buy extra tokens for this month from the balance (v2)
      description: billing.write. millions must be a position on the plan's token_addon slider; the price is what GET /billing/token-addons/quote gives. 400 INVALID_REQUEST off the slider, 400 ADDON_NOT_AVAILABLE when the plan sells none or the business's tokens are unlimited, 402 INSUFFICIENT_BALANCE when the balance is below the price (nothing changes).
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [millions]
              properties:
                millions:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: The add-on, and the business's billing afterwards.
          content:
            application/json:
              schema:
                type: object
                required: [addon, billing]
                properties:
                  addon:
                    $ref: '#/components/schemas/TokenAddonPurchase'
                  billing:
                    $ref: '#/components/schemas/BillingSummary'
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants/{id}/balance:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: creditBalance
      summary: Credit or debit a business's balance (v2)
      description: For platform admins. A negative amount debits; a debit can't take the balance below zero (400). Recorded as billing.credit or billing.debit. 404 TENANT_NOT_FOUND.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, note]
              properties:
                amount:
                  type: number
                  minimum: -1000000
                  maximum: 1000000
                  description: USD; positive credits, negative debits.
                note:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: The ledger entry and the new balance.
          content:
            application/json:
              schema:
                type: object
                required: [entry, balance]
                properties:
                  entry:
                    $ref: '#/components/schemas/BalanceEntry'
                  balance:
                    type: number
        default:
          $ref: '#/components/responses/Error'
  /plans:
    get:
      operationId: listPlans
      summary: The plans and their limits
      security:
        - MemberToken: []
      responses:
        '200':
          description: Plans, from the smallest.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
  /tenants:
    post:
      operationId: createBusiness
      summary: Create a business
      description: The signed-in person becomes its owner. Its ID comes from its name (with a short suffix when taken), its plan is free, and its first bot, support, starts from the business type's assistant. A person may own up to 3 businesses (403 BUSINESS_LIMIT_REACHED); platform admins aren't limited.
      security:
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, business_type]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                business_type:
                  type: string
                  description: An ID from GET /business-types.
      responses:
        '201':
          description: The business and its first bot's ID.
          content:
            application/json:
              schema:
                type: object
                required: [tenant, bot_id]
                properties:
                  tenant:
                    $ref: '#/components/schemas/Business'
                  bot_id:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /invites/preview:
    post:
      operationId: previewInvite
      summary: Describe the invitation in a link
      security:
        - MemberToken: []
      requestBody:
        $ref: '#/components/requestBodies/InviteToken'
      responses:
        '200':
          description: The business, role and address the invitation is for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        default:
          $ref: '#/components/responses/Error'
  /invites/accept:
    post:
      operationId: acceptInvite
      summary: Join the business an invitation is for
      description: The invitation must be pending, unexpired and addressed to the signed-in person's email (403 INVITE_EMAIL_MISMATCH otherwise). It works once (409 INVITE_USED); a revoked or expired one returns 410. Someone already a member keeps their role.
      security:
        - MemberToken: []
      requestBody:
        $ref: '#/components/requestBodies/InviteToken'
      responses:
        '200':
          description: The business joined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        default:
          $ref: '#/components/responses/Error'
  /tenant:
    get:
      operationId: getBusiness
      summary: The requesting business, its plan, limits and usage
      description: Needs members.read.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateBusiness
      summary: Rename the business or change its type
      description: Needs business.write. The type sets the configuration its bots start from until saved.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                business_type:
                  type: string
                auto_close_hours:
                  type: integer
                  minimum: 0
                  maximum: 2160
                  description: Open tickets without a channel, and those of channel types without a time, close after this many hours without activity; 0 never (v2).
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        default:
          $ref: '#/components/responses/Error'
  /tenant/logo:
    put:
      operationId: setBusinessLogo
      summary: Set the business logo
      description: Needs business.write. Send a PNG, JPEG or WebP image of 16-4096 pixels per side, as multipart/form-data in a field named file or as the raw body with an image content type. The type is read from the bytes, never trusted; SVG is refused. The image is stored in the public bucket and replaces the previous one. Answers 503 NOT_CONFIGURED when the server has no public bucket.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The picture's public URL.
          content:
            application/json:
              schema:
                type: object
                required: [logo_url]
                properties:
                  logo_url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeBusinessLogo
      summary: Remove the business logo
      description: Needs business.write. The file is deleted.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The picture is gone.
          content:
            application/json:
              schema:
                type: object
                required: [logo_url]
                properties:
                  logo_url:
                    type: 'null'
        default:
          $ref: '#/components/responses/Error'
  /tenant/leave:
    post:
      operationId: leaveBusiness
      summary: Leave the business
      description: Needs members.read. The last owner can't leave (409 LAST_OWNER).
      security:
        - MemberToken: []
      responses:
        '204':
          description: Left.
        default:
          $ref: '#/components/responses/Error'
  /tenant/deletion-request:
    get:
      operationId: getDeletionRequest
      summary: The business's latest deletion request (v2)
      description: Needs members.read. 404 DELETION_REQUEST_NOT_FOUND when there was none.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The latest request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: requestDeletion
      summary: Ask platform admins to delete the business (v2)
      description: Needs business.delete, which only owners have. 409 DELETION_REQUEST_PENDING when one is pending; 409 TENANT_PROTECTED for the default business. Recorded as business.deletion_requested.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: The request, pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: cancelDeletionRequest
      summary: Withdraw the pending deletion request (v2)
      description: Needs business.delete. 404 DELETION_REQUEST_NOT_FOUND when none is pending.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The request, cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        default:
          $ref: '#/components/responses/Error'
  /members:
    get:
      operationId: listMembers
      summary: The business's members, owners first
      description: Needs members.read.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        default:
          $ref: '#/components/responses/Error'
  /members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: setMemberRole
      summary: Change a member's role
      description: Needs members.write; changing an owner's role or making someone an owner needs owners.manage. The last owner keeps the role (409 LAST_OWNER).
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMember
      summary: Remove a member
      description: Needs members.write; removing an owner needs owners.manage. The last owner can't be removed (409 LAST_OWNER).
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /invites:
    get:
      operationId: listInvites
      summary: The business's pending invitations
      description: Needs members.read.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Invitations, newest first, without their tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvite
      summary: Invite someone by email
      description: Needs members.write; inviting an owner needs owners.manage. It replaces a pending invitation for the same address, works for 7 days, and counts against the plan's members (403 PLAN_LIMIT_REACHED). Returns the token once, for the link /invite/{token}; only its SHA-256 is stored. With DASHBOARD_URL set it also returns that link, and with SUPABASE_SECRET_KEY as well it emails the link through Supabase Auth (the Invite user email for a new address, the Magic Link email for an existing account), reporting whether it did in emailed. A failed email doesn't fail the invitation.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: The invitation, with its token this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        default:
          $ref: '#/components/responses/Error'
  /invites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^inv_[0-9a-f]{32}$'
    delete:
      operationId: revokeInvite
      summary: Cancel a pending invitation
      description: Needs members.write.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '204':
          description: Cancelled.
        default:
          $ref: '#/components/responses/Error'
  /audit:
    get:
      operationId: listAuditEvents
      summary: The business's latest 100 changes to members, invitations, keys and settings
      description: Needs audit.read.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants:
    get:
      operationId: listAllBusinesses
      summary: Every business, for platform admins
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Businesses, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformBusiness'
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ScopeID'
    patch:
      operationId: updateBusinessPlan
      summary: Change a business's plan, status or limits
      description: For platform admins. A suspended business's members (other than platform admins) get 403 TENANT_SUSPENDED and its chat keys stop working within a minute.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plan:
                  type: string
                  description: An ID from GET /plans.
                status:
                  type: string
                  enum: [active, suspended]
                limits:
                  $ref: '#/components/schemas/LimitOverrides'
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBusiness
      summary: Delete a business, restorable for 30 days (v2)
      description: For platform admins. Nobody reaches the business and its chat keys stop within a minute; a pending deletion request is approved. After restore_until the purge job erases every record, file and vector it had. 409 TENANT_DELETED when already deleted, 409 TENANT_PROTECTED for the default business. Recorded as business.deleted.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: The deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDeletion'
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ScopeID'
    post:
      operationId: restoreBusiness
      summary: Restore a deleted business (v2)
      description: For platform admins, within 30 days of the deletion (410 RESTORE_EXPIRED after). 404 TENANT_NOT_FOUND when no deleted business has this ID. Recorded as business.restored.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: The business.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        default:
          $ref: '#/components/responses/Error'
  /platform/deleted-tenants:
    get:
      operationId: listDeletedBusinesses
      summary: Deleted businesses, restorable or not (v2)
      description: For platform admins. Newest first; restored and purged deletions stay listed as the platform's record.
      security:
        - AdminKey: []
        - MemberToken: []
      responses:
        '200':
          description: Deletions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessDeletion'
        default:
          $ref: '#/components/responses/Error'
  /platform/deletion-requests:
    get:
      operationId: listDeletionRequests
      summary: Owners' deletion requests (v2)
      description: For platform admins. Newest first.
      security:
        - AdminKey: []
        - MemberToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, cancelled, all]
            default: pending
      responses:
        '200':
          description: Requests.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeletionRequest'
        default:
          $ref: '#/components/responses/Error'
  /platform/deletion-requests/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^dlr_[0-9a-f]{32}$'
    post:
      operationId: approveDeletionRequest
      summary: Approve a deletion request, deleting the business (v2)
      description: For platform admins. Deletes the business as DELETE /platform/tenants/{id} does, with the request's reason. 404 DELETION_REQUEST_NOT_FOUND when the request isn't pending.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: The deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDeletion'
        default:
          $ref: '#/components/responses/Error'
  /platform/deletion-requests/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^dlr_[0-9a-f]{32}$'
    post:
      operationId: rejectDeletionRequest
      summary: Reject a deletion request (v2)
      description: For platform admins. The note is shown to the business as review_note. 404 DELETION_REQUEST_NOT_FOUND when the request isn't pending. Recorded as business.deletion_rejected.
      security:
        - AdminKey: []
        - MemberToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: The request, rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequest'
        default:
          $ref: '#/components/responses/Error'
components:
  requestBodies:
    InviteToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token:
                type: string
                pattern: '^tpi_[0-9a-f]{48}$'
  securitySchemes:
    MemberToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A person's Supabase Auth access token, which the backend verifies with the project's JWKS (SUPABASE_URL). For a business's endpoints, send X-Truplexy-Tenant and X-Truplexy-Bot (400 SCOPE_REQUIRED without them). The person must belong to the business (404 TENANT_NOT_FOUND otherwise, so other businesses can't be found out) and their role must have the endpoint's permission (403 FORBIDDEN); platform admins may do anything. A suspended business returns 403 TENANT_SUSPENDED.
    ChatKey:
      type: http
      scheme: bearer
      description: CHAT_API_KEY, which acts for the default bot, or a key issued with POST /api-keys, which acts for its bot. The key alone decides whose knowledge and conversations a request reaches. Keep it on your own server.
    PlaygroundKey:
      type: http
      scheme: bearer
      description: PLAYGROUND_API_KEY, an application access key separate from Cloudflare credentials.
    AdminKey:
      type: http
      scheme: bearer
      description: ADMIN_API_KEY, a service credential with every permission in every business. It acts for the default bot, or for the bot named by the X-Truplexy-Tenant and X-Truplexy-Bot headers (404 BOT_NOT_FOUND if it doesn't exist). Missing configuration returns 503 ADMIN_NOT_CONFIGURED; D1 failures return 502 DATABASE_ERROR, and R2, Vectorize, or Workers AI failures 502 STORAGE_ERROR.
  parameters:
    CustomerID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^cus_[0-9a-f]{32}$'
    ChannelID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^chn_[0-9a-f]{32}$'
    ConversationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^conv_[0-9a-f]{32}$'
    TicketID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^tkt_[0-9a-f]{32}$'
    DocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^doc_[0-9a-f]{32}$'
    ToolName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,63}$'
  headers:
    RequestID:
      description: Server-generated identifier for this request.
      schema:
        type: string
        example: req_7eecc8be1e594f01a0ca18563223c9f0
  responses:
    Error:
      description: JSON error; unknown routes return 404 and unsupported methods return 405.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LatencyStats:
      type: object
      description: Durations in milliseconds with nearest-rank percentiles. count is how many durations it covers.
      required: [count, avg_ms, p50_ms, p95_ms, p99_ms, max_ms]
      properties:
        count:
          type: integer
        avg_ms:
          type: number
        p50_ms:
          type: integer
        p95_ms:
          type: integer
        p99_ms:
          type: integer
        max_ms:
          type: integer
    RoutePerformance:
      description: One route's requests and latency. route is the router's pattern without the API version.
      allOf:
        - $ref: '#/components/schemas/LatencyStats'
        - type: object
          required: [method, route, requests, errors, server_errors, error_rate]
          properties:
            method:
              type: string
            route:
              type: string
              example: /conversations/{id}/messages
            requests:
              type: integer
            errors:
              type: integer
              description: 4xx and 5xx responses.
            server_errors:
              type: integer
              description: 5xx responses.
            error_rate:
              type: number
    StagePerformance:
      description: One pipeline stage's latency, over the replies it ran for.
      allOf:
        - $ref: '#/components/schemas/LatencyStats'
        - type: object
          required: [stage, ran, share]
          properties:
            stage:
              type: string
              description: prepare, quota, retrieval, web_search, llm, postprocess or other; or a retrieval stage (rewrite, embed, dense, lexical, load, rerank).
            ran:
              type: integer
              description: Replies the stage took at least 1 ms for.
            share:
              type: number
              description: The stage's part of all reply time, from 0 to 1.
    PerformanceStats:
      type: object
      required: [from, to, scope, recording, requests, latency, pipeline, rag, models]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        scope:
          type: string
          enum: [bot, business, platform]
        recording:
          type: object
          description: Which records the server keeps, so zero can be told from not recorded.
          required: [http, sample_rate, model_attempts]
          properties:
            http:
              type: boolean
              description: Requests are stored (PERF_HTTP_STATS).
            sample_rate:
              type: number
              description: The share of requests stored, above 0 and at most 1.
            model_attempts:
              type: boolean
              description: Model calls are stored (MODEL_ATTEMPT_RECORDS).
        requests:
          type: object
          description: HTTP requests handled. Counts are scaled by the sample weight; latency percentiles are over the stored sample.
          required: [total, errors, server_errors, error_rate, server_error_rate, by_status, by_route, by_day]
          properties:
            total:
              type: integer
            errors:
              type: integer
            server_errors:
              type: integer
            error_rate:
              type: number
            server_error_rate:
              type: number
            by_status:
              type: object
              description: Counts by status class, 2xx, 3xx, 4xx and 5xx.
              additionalProperties:
                type: integer
            by_route:
              type: array
              description: The 50 busiest routes.
              items:
                $ref: '#/components/schemas/RoutePerformance'
            by_day:
              type: array
              description: Every day in the range.
              items:
                type: object
                required: [date, requests, errors, server_errors, p50_ms, p95_ms]
                properties:
                  date:
                    type: string
                    format: date
                  requests:
                    type: integer
                  errors:
                    type: integer
                  server_errors:
                    type: integer
                  p50_ms:
                    type: integer
                  p95_ms:
                    type: integer
        latency:
          $ref: '#/components/schemas/LatencyStats'
        pipeline:
          type: object
          description: Where a reply's time went, from the answers recorded in the range.
          required: [replies, total, stages, retrieval_stages]
          properties:
            replies:
              type: integer
            total:
              $ref: '#/components/schemas/LatencyStats'
            stages:
              type: array
              description: prepare, quota, retrieval, web_search, llm, postprocess and other, in order. They add up to total; other is the time no stage accounts for, which includes the prepare, quota and postprocess time of replies recorded before those timings existed.
              items:
                $ref: '#/components/schemas/StagePerformance'
            retrieval_stages:
              type: array
              description: rewrite, embed, dense, lexical, load and rerank. They overlap (dense and lexical search run together), so they do not add up.
              items:
                $ref: '#/components/schemas/StagePerformance'
        rag:
          type: object
          description: How well retrieval served the replies of the range. Rates are shares of replies, from 0 to 1.
          required: [replies, answered_rate, no_answer_rate, clarification_rate, handoff_rate, empty_retrieval_rate, cache_hit_rate, cache_hits, rewrite_rate, degraded_rate, degraded, confidence, web_search_rate, split_rate, avg_candidates, avg_passages, avg_top_score, retrieval]
          properties:
            replies:
              type: integer
            answered_rate:
              type: number
            no_answer_rate:
              type: number
            clarification_rate:
              type: number
            handoff_rate:
              type: number
            empty_retrieval_rate:
              type: number
              description: Replies with no passage to answer from.
            cache_hit_rate:
              type: number
            cache_hits:
              type: object
              description: Cache hits by kind, such as semantic or retrieval.
              additionalProperties:
                type: integer
            rewrite_rate:
              type: number
            degraded_rate:
              type: number
            degraded:
              type: object
              description: Replies that went on without a stage that failed, by stage.
              additionalProperties:
                type: integer
            confidence:
              type: object
              description: Replies by how well the evidence supported an answer, high, low or none; unknown when nothing was searched.
              additionalProperties:
                type: integer
            web_search_rate:
              type: number
              description: Replies that used web results.
            split_rate:
              type: number
              description: Replies whose message was split into several questions.
            avg_candidates:
              type: number
            avg_passages:
              type: number
            avg_top_score:
              type: number
              description: The best passage's average rerank score.
            retrieval:
              $ref: '#/components/schemas/LatencyStats'
        models:
          type: array
          description: The 10 most-called models, including calls that failed before a fallback answered. Empty unless MODEL_ATTEMPT_RECORDS is on.
          items:
            allOf:
              - $ref: '#/components/schemas/LatencyStats'
              - type: object
                required: [model, attempts, failures, failure_rate]
                properties:
                  model:
                    type: string
                  attempts:
                    type: integer
                  failures:
                    type: integer
                  failure_rate:
                    type: number
        tenants:
          type: array
          description: The 20 businesses with the most requests. Platform scope only.
          items:
            type: object
            required: [tenant_id, name, requests, server_errors, server_error_rate]
            properties:
              tenant_id:
                type: string
              name:
                type: string
              requests:
                type: integer
              server_errors:
                type: integer
              server_error_rate:
                type: number
    ToolCall:
      type: object
      required: [name, arguments, status, output, latency_ms]
      properties:
        name:
          type: string
        arguments:
          description: The arguments as the model sent them; a string when they were not valid JSON.
        status:
          type: string
          enum: [ok, error]
        output:
          type: string
          description: Exactly what the model received, usually JSON, at most 8000 characters. API tools return {"status", "body"}.
        latency_ms:
          type: integer
    Tool:
      type: object
      required: [name, description, parameters, read_only, available, api]
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          description: JSON Schema for the arguments.
          additionalProperties: true
        read_only:
          type: boolean
        available:
          type: boolean
        unavailable_reason:
          type: string
          description: Present only when available is false.
        api:
          type: object
          description: How the tool calls its endpoint.
          required: [method, url, created_at, updated_at]
          properties:
            method:
              type: string
            url:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    APIToolInput:
      type: object
      additionalProperties: false
      required: [name, description, method, url]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: Unique.
        description:
          type: string
          minLength: 1
          maxLength: 1000
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        url:
          type: string
          maxLength: 2000
          description: https:// URL (http://localhost only while APP_ENV=development). {name} placeholders may appear after the host, in the path or the query string, and need a required string or integer parameter of the same name.
          example: https://api.example.com/orders/{order_id}
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema with type object, at most 8 KB and 3 levels deep, using only type, description, properties, required, enum, items, and additionalProperties (false). Defaults to an object with no properties.
        read_only:
          type: boolean
          description: False when calling the tool changes data.
    KnowledgeSource:
      type: object
      required: [document_id, title, score]
      properties:
        document_id:
          type: string
        title:
          type: string
        section:
          type: string
          description: The heading path of the cited passage.
        url:
          type: string
          description: The document's source_url, or the web page's.
        score:
          type: number
          description: Relevance from 0 to 1.
        kind:
          type: string
          enum: [web]
          description: web for a web search result; left out for the knowledge base.
    WebSearchOptions:
      type: object
      additionalProperties: false
      description: Web search for the message, with Tavily (v2). Needs rag_enabled. The question is redacted before it is sent, results are filtered and treated as untrusted, and searches count against the plan.
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [fallback, always]
          default: fallback
          description: fallback searches only when the knowledge base has no confident answer.
        max_results:
          type: integer
          minimum: 1
          maximum: 8
          default: 3
        depth:
          type: string
          enum: [basic, advanced]
          default: basic
        topic:
          type: string
          enum: [general, news]
          default: general
        time_range:
          type: string
          enum: ['', day, week, month, year]
        include_domains:
          type: array
          maxItems: 50
          description: Only these sites and their subdomains, such as docs.example.com.
          items:
            type: string
        exclude_domains:
          type: array
          maxItems: 50
          items:
            type: string
    BotWebSearch:
      type: object
      description: A bot's web search settings (v2); see WebSearchOptions. Missing fields get their defaults. Turning it on needs ragEnabled, a server with a search provider, TAVILY_API_KEY or WEB_SEARCH_PROVIDER=openrouter (400 WEB_SEARCH_NOT_CONFIGURED) and a plan with web search (403 PLAN_LIMIT_REACHED, limit web_search).
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [fallback, always]
        maxResults:
          type: integer
          minimum: 1
          maximum: 8
        depth:
          type: string
          enum: [basic, advanced]
        topic:
          type: string
          enum: [general, news]
        timeRange:
          type: string
          enum: ['', day, week, month, year]
        includeDomains:
          type: array
          maxItems: 50
          items:
            type: string
        excludeDomains:
          type: array
          maxItems: 50
          items:
            type: string
    PlatformUser:
      type: object
      required: [id, email, name, platform_admin, status, created_at, memberships]
      properties:
        id:
          type: string
        email:
          type: string
          description: deleted+{id}@invalid once deleted.
        name:
          type: string
        platform_admin:
          type: boolean
        status:
          type: string
          enum: [active, disabled, deleted]
        disabled_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        memberships:
          type: array
          items:
            type: object
            properties:
              tenant_id:
                type: string
              tenant_name:
                type: string
              role:
                type: string
    PlatformUserDetail:
      allOf:
        - $ref: '#/components/schemas/PlatformUser'
        - type: object
          properties:
            activity:
              type: array
              description: The last 50 audit events the person made, in any business.
              items:
                type: object
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  actor:
                    type: string
                  action:
                    type: string
                  target:
                    type: string
                  created_at:
                    type: string
                    format: date-time
    AnswerStatus:
      type: string
      enum: [answered, clarification_required, no_answer, handoff, handoff_offered, escalated, context]
      description: answered from the knowledge base (or small talk); clarification_required when the reply asks a question; no_answer when no reliable information was found; handoff when the conversation was flagged for the support team; handoff_offered (chat API only) when no answer was found or the customer asked for a person, and the reply offers to connect them with the team, which they confirm through the handoff endpoint (after RAG_HANDOFF_OFFERS offers in a row left unanswered, the next is a handoff instead); escalated when a person has taken the conversation over, so the message was stored with no reply; context (chat API only) when the message started with "[Context only" and was stored as history with no reply. clarification_required also answers a message the assistant couldn't understand, and after two clarifying questions in a row the chat API offers the team instead (handoff_offered). Only a response reports escalated or context; stored replies never have them.
    ScopeID:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,30}$'
    RetrievalFilters:
      type: object
      additionalProperties: false
      description: Narrow retrieval to documents with this metadata; each needs a Vectorize metadata index (go run ./cmd/rag metadata-indexes).
      properties:
        knowledge_base_id:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 64
        product:
          type: string
          maxLength: 64
        version:
          type: string
          maxLength: 64
    Passage:
      type: object
      required: [title, content]
      properties:
        id:
          type: integer
          description: The source number the model cites.
        document_id:
          type: string
        title:
          type: string
        section:
          type: string
        url:
          type: string
        content:
          type: string
    TraceItem:
      type: object
      required: [id, rank]
      properties:
        id:
          type: string
        document_id:
          type: string
        title:
          type: string
        section:
          type: string
        rank:
          type: integer
        score:
          type: number
    RetrievalTrace:
      type: object
      description: How retrieval ran. Rankings and context appear only in debug mode.
      properties:
        query:
          type: string
        rewritten_query:
          type: string
        timings:
          type: object
          properties:
            rewrite_ms:
              type: integer
            embed_ms:
              type: integer
            dense_ms:
              type: integer
            lexical_ms:
              type: integer
            load_ms:
              type: integer
            rerank_ms:
              type: integer
            retrieval_ms:
              type: integer
            llm_ms:
              type: integer
            total_ms:
              type: integer
        candidates:
          type: integer
        final_chunks:
          type: integer
        top_score:
          type: number
        cache_hit:
          type: string
        degraded:
          type: array
          items:
            type: string
        confidence:
          type: string
        dense:
          type: array
          items:
            $ref: '#/components/schemas/TraceItem'
        lexical:
          type: array
          items:
            $ref: '#/components/schemas/TraceItem'
        fused:
          type: array
          items:
            $ref: '#/components/schemas/TraceItem'
        reranked:
          type: array
          items:
            $ref: '#/components/schemas/TraceItem'
        context:
          type: array
          items:
            $ref: '#/components/schemas/Passage'
    Role:
      type: string
      enum: [owner, admin, editor, agent, viewer]
    Limits:
      type: object
      description: 0 means unlimited.
      required: [bots, documents_per_bot, members, replies_per_month, tokens_per_month]
      properties:
        bots:
          type: integer
        documents_per_bot:
          type: integer
        members:
          type: integer
          description: Members and pending invitations.
        replies_per_month:
          type: integer
          description: AI replies (model calls) in a calendar month, UTC.
        tokens_per_month:
          type: integer
          description: Tokens of those replies in a calendar month, UTC. Extra tokens bought add to it; past both, replies are paid from the balance.
        web_search:
          type: boolean
          description: Whether bots may search the web (v2).
        web_searches_per_month:
          type: integer
          description: Web searches that ran in a calendar month, UTC (v2).
        image_input:
          type: boolean
          description: Whether customers may attach pictures to a message (image input). Free has none.
    LimitOverrides:
      type: object
      additionalProperties: false
      description: Limits that replace the plan's for one business; 0 means unlimited.
      properties:
        bots:
          type: integer
          minimum: 0
        documents_per_bot:
          type: integer
          minimum: 0
        members:
          type: integer
          minimum: 0
        replies_per_month:
          type: integer
          minimum: 0
        tokens_per_month:
          type: integer
          minimum: 0
          maximum: 100000000000
        web_search:
          type: boolean
          description: Turns web search on or off whatever the plan says (v2).
        web_searches_per_month:
          type: integer
          minimum: 0
        image_input:
          type: boolean
          description: Turns image input on or off whatever the plan says.
    PlatformSettings:
      type: object
      required: [vision_model]
      properties:
        vision_model:
          type: object
          required: [value, default, effective, source]
          properties:
            value:
              type: string
              description: What a platform admin set; empty when nothing is set.
            default:
              type: string
              description: The server's LLM_VISION_MODEL; empty when unset.
            effective:
              type: string
              description: The model in use; empty when there is none.
            source:
              type: string
              enum: [console, env, none]
    TokenAddon:
      type: object
      nullable: true
      description: Extra tokens a plan sells for the current month, as a slider from min_millions to max_millions in steps of step_millions. They cost a flat price per million - Starter 8 USD (1-5M), Pro 6 USD (1-30M); Free sells none. Every plan has a single tier today; more would be graduated - each million costs its own tier's price, so buying more never costs less. GET /billing/token-addons/quote prices an amount.
      required: [price_per_million, min_millions, max_millions, step_millions, currency, tiers]
      properties:
        price_per_million:
          type: number
          description: What 1M costs (the first tier's price).
        min_millions:
          type: integer
        max_millions:
          type: integer
        step_millions:
          type: integer
        currency:
          type: string
          enum: [USD]
        tiers:
          type: array
          items:
            type: object
            required: [from_millions, price_per_million]
            properties:
              from_millions:
                type: integer
                description: Each million from this one up to the next tier's costs price_per_million.
              price_per_million:
                type: number
    TokenQuote:
      type: object
      required: [millions, tokens, price, average_per_million, currency, breakdown]
      properties:
        millions:
          type: integer
        tokens:
          type: integer
        price:
          type: number
          description: USD, the total.
        average_per_million:
          type: number
        currency:
          type: string
          enum: [USD]
        breakdown:
          type: array
          items:
            type: object
            required: [from_millions, to_millions, millions, price_per_million, amount]
            properties:
              from_millions:
                type: integer
              to_millions:
                type: integer
              millions:
                type: integer
              price_per_million:
                type: number
              amount:
                type: number
    TokenAddonPurchase:
      type: object
      required: [id, tokens, price, month, actor, created_at]
      properties:
        id:
          type: string
        tokens:
          type: integer
        price:
          type: number
          description: USD.
        month:
          type: string
          description: YYYY-MM (UTC); the tokens count that month only.
        actor:
          type: string
        created_at:
          type: string
          format: date-time
    BillingSummary:
      type: object
      required: [currency, balance, month, plan, tokens, token_addon, addons]
      properties:
        currency:
          type: string
          enum: [USD]
        balance:
          type: number
        month:
          type: string
          description: YYYY-MM, UTC.
        plan:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        tokens:
          type: object
          required: [unlimited, plan_allowance, addons, allowance, used, remaining]
          properties:
            unlimited:
              type: boolean
            plan_allowance:
              type: integer
            addons:
              type: integer
            allowance:
              type: integer
              description: plan_allowance + addons.
            used:
              type: integer
            remaining:
              type: integer
              nullable: true
              description: null when unlimited.
        token_addon:
          $ref: '#/components/schemas/TokenAddon'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/TokenAddonPurchase'
    BalanceEntry:
      type: object
      required: [id, amount, balance_after, kind, note, actor, created_at]
      properties:
        id:
          type: string
        amount:
          type: number
          description: USD; positive adds to the balance, negative spends it.
        balance_after:
          type: number
        kind:
          type: string
          enum: [credit, debit, token_addon, overage]
        note:
          type: string
        actor:
          type: string
        usage_id:
          type: string
          description: The reply an overage paid for.
        addon_id:
          type: string
          description: The extra tokens a token_addon bought.
        created_at:
          type: string
          format: date-time
    Plan:
      type: object
      required: [id, name, limits, token_addon]
      properties:
        id:
          type: string
        name:
          type: string
        limits:
          $ref: '#/components/schemas/Limits'
        token_addon:
          $ref: '#/components/schemas/TokenAddon'
    BusinessType:
      type: object
      required: [id, label, description, assistant_name, knowledge_topics, tool_ideas]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        assistant_name:
          type: string
        knowledge_topics:
          type: array
          items:
            type: string
        tool_ideas:
          type: array
          items:
            type: string
    Business:
      type: object
      required: [id, name, business_type, plan, status, created_at, limits, limit_overrides, usage]
      properties:
        id:
          $ref: '#/components/schemas/ScopeID'
        name:
          type: string
        logo_url:
          type: string
          format: uri
          description: The business's logo; left out when it has none.
        business_type:
          type: string
        plan:
          type: string
        status:
          type: string
          enum: [active, suspended]
        created_at:
          type: string
          format: date-time
        auto_close_hours:
          type: integer
          description: Hours without activity after which open tickets without a channel, and those of channel types without a time, close; 0 never (v2).
        limits:
          $ref: '#/components/schemas/Limits'
        limit_overrides:
          $ref: '#/components/schemas/LimitOverrides'
        usage:
          type: object
          required: [bots, members, replies_this_month, tokens_this_month]
          properties:
            bots:
              type: integer
            members:
              type: integer
            replies_this_month:
              type: integer
            tokens_this_month:
              type: integer
        balance:
          type: number
          description: USD; see GET /billing.
        deleted_at:
          type: string
          format: date-time
          description: Only on a deleted business, which platform admins alone see; it can be restored for 30 days.
    BusinessDeletion:
      type: object
      required: [id, tenant_id, tenant_name, owner_email, reason, deleted_by, deleted_at, restore_until, state, restorable]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        owner_email:
          type: string
        reason:
          type: string
        request_id:
          type: string
        deleted_by:
          type: string
          description: A user ID, or service for the admin key.
        deleted_by_email:
          type: string
        deleted_at:
          type: string
          format: date-time
        restore_until:
          type: string
          format: date-time
        restored_at:
          type: string
          format: date-time
        restored_by:
          type: string
        purged_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [deleted, restored, purged]
        restorable:
          type: boolean
    DeletionRequest:
      type: object
      required: [id, tenant_id, tenant_name, requested_by, reason, status, created_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        requested_by:
          type: string
        requested_by_email:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        reviewed_by:
          type: string
        review_note:
          type: string
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
    PlatformBusiness:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          required: [owner_email, first_bot]
          properties:
            owner_email:
              type: string
            first_bot:
              type: string
    Membership:
      type: object
      required: [tenant_id, name, business_type, plan, status, role, bots]
      properties:
        tenant_id:
          type: string
        name:
          type: string
        business_type:
          type: string
        plan:
          type: string
        status:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        logo_url:
          type: string
          format: uri
          description: The business's logo; left out when it has none.
        bots:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              avatar_url:
                type: string
                format: uri
                description: The bot's picture; left out when it has none.
    Me:
      type: object
      required: [user, platform_admin, memberships, roles]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
            avatar_url:
              type: string
              format: uri
              description: The person's picture; left out when they have none.
        platform_admin:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        roles:
          type: object
          description: Each role's permissions, such as knowledge.write.
          additionalProperties:
            type: array
            items:
              type: string
    Member:
      type: object
      required: [user_id, email, name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
          format: uri
          description: The member's picture; left out when they have none.
        role:
          $ref: '#/components/schemas/Role'
        joined_at:
          type: string
          format: date-time
    Invite:
      type: object
      required: [id, email, role, status, expires_at, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [pending, accepted, revoked]
        invited_by:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          type: string
          description: Only when the invitation is created.
        link:
          type: string
          format: uri
          description: The dashboard's /invite/{token} page, only when the invitation is created and DASHBOARD_URL is set.
        emailed:
          type: boolean
          description: Whether the link was emailed through Supabase Auth, only when the invitation is created.
    InvitePreview:
      type: object
      required: [tenant_id, business_name, email, role, expires_at]
      properties:
        tenant_id:
          type: string
        business_name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expires_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, actor, action, created_at]
      properties:
        id:
          type: string
        actor:
          type: string
          description: A user ID, or service for the admin key.
        actor_email:
          type: string
          description: The actor's email when the event happened. It doesn't change if the account is later deleted or its email changes.
        action:
          type: string
          example: member.role_changed
        target:
          type: string
        target_email:
          type: string
          description: When the target is a user, their email when the event happened.
        details: {}
        created_at:
          type: string
          format: date-time
    TenantBot:
      type: object
      required: [tenant_id, id, name, kb_version, created_at]
      properties:
        tenant_id:
          type: string
        id:
          type: string
        name:
          type: string
        kb_version:
          type: integer
          description: Increases whenever the bot's knowledge base changes.
        created_at:
          type: string
          format: date-time
        avatar_url:
          type: string
          format: uri
          description: The bot's picture; left out when it has none.
    OfferedChannelType:
      type: object
      required: [id, label, description, icon, offered]
      properties:
        id:
          type: string
          example: discord
        label:
          type: string
        description:
          type: string
        icon:
          type: string
        offered:
          type: boolean
          description: False for an upcoming type, and for a hidden type one of the bot's channels still uses; don't offer it for new channels.
        upcoming:
          type: boolean
          description: True for a type a platform admin marked upcoming; show it as Upcoming. Absent on APIs that predate the status.
    AdminChannelType:
      type: object
      required: [id, label, description, icon, status, sort_order, channels, created_at, updated_at]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        icon:
          type: string
        status:
          type: string
          enum: [active, upcoming, hidden]
        sort_order:
          type: integer
        channels:
          type: integer
          description: Businesses' channels of this type.
        auto_close_hours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2160
          description: Hours without activity after which open tickets from channels of the type close, unless a channel sets its own; 0 never, null leaves it to each business (v2).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelTypeInput:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        icon:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [active, upcoming, hidden]
        sort_order:
          type: integer
          minimum: -10000
          maximum: 10000
        auto_close_hours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2160
          description: Null leaves it to each business; leaving it out keeps it (v2).
    Customer:
      type: object
      required: [id, tenant_id, bot_id, name, contacts, metadata, first_seen_at, last_seen_at, conversations, tickets, open_tickets, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^cus_[0-9a-f]{32}$'
        tenant_id:
          type: string
        bot_id:
          type: string
        name:
          type: string
        contacts:
          type: array
          description: In the order they were added.
          items:
            $ref: '#/components/schemas/Contact'
        metadata:
          type: object
          additionalProperties: true
          description: Whatever the caller keeps about the customer, up to 4 KB.
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        conversations:
          type: integer
        tickets:
          type: integer
        open_tickets:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Contact:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
          description: email, phone, a platform such as discord or telegram, or any word for your own user IDs. The same type and value can't be on two of a bot's customers.
        value:
          type: string
          maxLength: 254
          description: An email is lowercased and must be an address; a phone loses spaces, dashes, dots and parentheses and must be 5-20 digits, optionally starting with +. Other values are stored as sent.
        label:
          type: string
          maxLength: 60
        primary:
          type: boolean
          description: The customer's main contact of its type. At most one per type; the first of a type when none is marked.
    CustomerInput:
      type: object
      additionalProperties: false
      description: A name or at least one contact is required.
      properties:
        name:
          type: string
          maxLength: 120
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Contact'
        metadata:
          type: object
          additionalProperties: true
          description: Up to 4 KB.
    Channel:
      type: object
      required: [id, tenant_id, bot_id, type, type_label, name, description, external_id, enabled, disabled_by_platform, active, open_tickets, tickets, api_keys, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^chn_[0-9a-f]{32}$'
        tenant_id:
          type: string
        bot_id:
          type: string
        type:
          type: string
          description: A channel type's id.
        type_label:
          type: string
        name:
          type: string
        description:
          type: string
        external_id:
          type: string
          description: The platform's own ID, such as a Discord server's.
        enabled:
          type: boolean
          description: The business's switch.
        disabled_by_platform:
          type: boolean
          description: A platform admin's switch.
        active:
          type: boolean
          description: Enabled and not disabled by the platform; only then do the chat API keys bound to it work.
        open_tickets:
          type: integer
        tickets:
          type: integer
        api_keys:
          type: integer
          description: Active chat API keys bound to the channel.
        auto_close_hours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2160
          description: Hours without activity after which the channel's open tickets close; 0 never, null uses the channel type's, else the business's (v2).
        effective_auto_close_hours:
          type: integer
          description: The time that applies; 0 never (v2).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelInput:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          description: An offered id from GET /channel-types.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Unique among the bot's channels.
        description:
          type: string
          maxLength: 300
        external_id:
          type: string
          maxLength: 128
        enabled:
          type: boolean
        auto_close_hours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2160
          description: Null uses the channel type's; leaving it out keeps it (v2).
    APIKey:
      type: object
      required: [id, name, tenant_id, bot_id, key_prefix, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        tenant_id:
          type: string
        bot_id:
          type: string
        key_prefix:
          type: string
        channel_id:
          type: string
          description: The channel the key is bound to (v2); its conversations and their tickets are marked with it.
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        key:
          type: string
          description: The secret, returned only when the key is created.
    StoredMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time
        model:
          type: string
        latency_ms:
          type: integer
        finish_reason:
          type: string
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            total_tokens:
              type: integer
            cost:
              type: number
        status:
          $ref: '#/components/schemas/AnswerStatus'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
        context_tokens:
          type: integer
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        error:
          type: string
          description: Why a customer message got no reply.
        author:
          type: string
          enum: [agent]
          description: Set on a reply a person wrote from a ticket or on an integration's platform.
        agent:
          type: string
          description: Who wrote an agent reply.
        via:
          type: string
          enum: [api]
          description: Set on an agent reply recorded through the chat API from an integration's platform.
        attachments:
          type: array
          description: Image input. The pictures a customer message carried; absent when it carried none.
          items:
            $ref: '#/components/schemas/Attachment'
    Conversation:
      type: object
      required: [id, created_at, updated_at, messages]
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        escalated:
          type: boolean
          description: True while a person has taken the conversation over.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/StoredMessage'
    OfferedModel:
      type: object
      required: [id, label, description, tier, input_price_per_mtok, output_price_per_mtok, currency, context_tokens, max_output_tokens, supports_tools, is_default, offered]
      properties:
        id:
          type: string
          description: The OpenRouter model ID.
        label:
          type: string
        description:
          type: string
        tier:
          type: string
          enum: [economy, standard, premium]
        input_price_per_mtok:
          type: number
          description: What the business pays per million input tokens, fee and commission included.
        output_price_per_mtok:
          type: number
          description: What the business pays per million output tokens, fee and commission included.
        currency:
          type: string
          enum: [USD]
        context_tokens:
          type: integer
        max_output_tokens:
          type: integer
          description: Caps the bot's maximum output tokens; 0 is no cap.
        supports_tools:
          type: boolean
        supports_vision:
          type: boolean
          description: Whether the model reads pictures (image input).
        is_default:
          type: boolean
        offered:
          type: boolean
    TemplateVariable:
      type: object
      required: [key, label, required, max_length]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        label:
          type: string
        help:
          type: string
        required:
          type: boolean
        max_length:
          type: integer
          minimum: 1
          maximum: 2000
    OfferedTemplate:
      type: object
      required: [id, name, description, body, variables, is_default, offered]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        body:
          type: string
          description: The system prompt. {{key}} is replaced by a variable's value and {{#key}}…{{/key}} kept only when it has one; business_name and assistant_name are filled in from the business and the bot.
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVariable'
        is_default:
          type: boolean
        offered:
          type: boolean
    CatalogModel:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        input_price_per_mtok:
          type: number
          description: OpenRouter's price, USD per million tokens.
        output_price_per_mtok:
          type: number
          description: OpenRouter's price, USD per million tokens.
        fee_percent:
          type: number
          nullable: true
          description: The model's own fee, a percentage of its prices; null uses the platform default (PRICE_FEE_PERCENT).
        commission_percent:
          type: number
          nullable: true
          description: The model's own commission, a percentage of its prices; null uses the platform default (PRICE_COMMISSION_PERCENT).
        effective_fee_percent:
          type: number
        effective_commission_percent:
          type: number
        billed_input_price_per_mtok:
          type: number
          description: What businesses see and pay, price × (1 + (fee + commission) / 100).
        billed_output_price_per_mtok:
          type: number
          description: What businesses see and pay, price × (1 + (fee + commission) / 100).
        pricing_synced_at:
          type: string
          description: When the prices were last read from OpenRouter, RFC 3339; empty if they never were.
        context_tokens:
          type: integer
        max_output_tokens:
          type: integer
        supports_tools:
          type: boolean
        supports_prompt_cache:
          type: boolean
        supports_vision:
          type: boolean
          description: Whether the model reads pictures (image input). Read from OpenRouter when the model is added without it.
        routing_tier:
          type: string
          nullable: true
          enum: [fast, balanced, advanced, null]
          description: The questions routing uses the model for - fast for simple, balanced for moderate, advanced for complex. Null keeps the model out of routing. The tier is set by the admin, never by price.
        status:
          type: string
          enum: [active, hidden, retired]
        is_default:
          type: boolean
        sort_order:
          type: integer
        bots:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CatalogModelInput:
      type: object
      additionalProperties: false
      description: id is required when creating and ignored when changing. Creating a model without both prices reads them, and any label, context_tokens, max_output_tokens, supports_tools and supports_vision left out, from OpenRouter; with both prices, label is required.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._:/-]{0,119}$'
        label:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        input_price_per_mtok:
          type: number
          minimum: 0
          maximum: 10000
        output_price_per_mtok:
          type: number
          minimum: 0
          maximum: 10000
        fee_percent:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000
          description: null returns the model to the platform default; leaving it out keeps its value.
        commission_percent:
          type: number
          nullable: true
          minimum: 0
          maximum: 1000
          description: null returns the model to the platform default; leaving it out keeps its value.
        context_tokens:
          type: integer
          minimum: 0
        max_output_tokens:
          type: integer
          minimum: 0
          maximum: 1000000
        supports_tools:
          type: boolean
        supports_prompt_cache:
          type: boolean
        supports_vision:
          type: boolean
          description: Whether the model reads pictures (image input). Read from OpenRouter when the model is added without it.
        routing_tier:
          type: string
          nullable: true
          enum: [fast, balanced, advanced, null]
          description: The questions routing uses the model for - fast for simple, balanced for moderate, advanced for complex. Null keeps the model out of routing. The tier is set by the admin, never by price.
        status:
          type: string
          enum: [active, hidden, retired]
        is_default:
          type: boolean
        sort_order:
          type: integer
    CatalogTemplate:
      allOf:
        - $ref: '#/components/schemas/OfferedTemplate'
        - type: object
          properties:
            business_types:
              type: array
              items:
                type: string
            status:
              type: string
              enum: [active, hidden, retired]
            version:
              type: integer
            bots:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    CatalogTemplateInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 300
        body:
          type: string
          minLength: 1
          maxLength: 20000
        variables:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TemplateVariable'
        business_types:
          type: array
          description: Business types offered the template; empty offers it to all.
          items:
            type: string
        status:
          type: string
          enum: [active, hidden, retired]
        is_default:
          type: boolean
    Bot:
      type: object
      required: [name, prompt, model, temperature, maxTokens, ragEnabled, topK, toolsEnabled, tools]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          maxLength: 20000
          description: The prompt of a bot saved before prompt templates, used until it picks one. It can't be changed (400 PROMPT_NOT_EDITABLE); send it back as loaded, or empty.
        promptTemplateId:
          type: string
          maxLength: 64
          description: A template from GET /prompt-templates. Choosing one clears prompt. 400 PROMPT_TEMPLATE_NOT_ALLOWED for one not offered.
        promptVariables:
          type: object
          additionalProperties:
            type: string
          description: Values for the template's variables; others are dropped, and a missing required one is refused (400 INVALID_PROMPT_VARIABLES).
        model:
          type: string
          maxLength: 120
          deprecated: true
          description: Platform-managed; a business's save keeps the saved value and drops this one; replies use the platform's setting. The platform's default model answers unless routing picks another.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          deprecated: true
          description: Platform-managed; a business's save keeps the saved value and drops this one; replies use the platform's setting. (CHAT_TEMPERATURE)
        maxTokens:
          type: integer
          minimum: 1
          maximum: 32768
          deprecated: true
          description: Platform-managed; a business's save keeps the saved value and drops this one; replies use the platform's setting. (CHAT_MAX_TOKENS)
        ragEnabled:
          type: boolean
        topK:
          type: integer
          minimum: 1
          maximum: 20
          deprecated: true
          description: Platform-managed; a business's save keeps the saved value and drops this one; replies use the platform's setting. (CHAT_TOP_K)
        toolsEnabled:
          type: boolean
        tools:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,63}$'
        webSearch:
          $ref: '#/components/schemas/BotWebSearch'
        routing:
          $ref: '#/components/schemas/BotRouting'
        knowledge:
          $ref: '#/components/schemas/BotKnowledge'
    BotKnowledge:
      type: object
      description: |
        Which sources a chat-API bot may answer from, and how deeply it retrieves (optional; absent keeps the behavior bots had before this existed). Needs ragEnabled (400 otherwise). The server's KNOWLEDGE_POLICY_MAX is a ceiling the bot can only narrow. Facts about the business, and a customer's own records or actions, always need the knowledge base or an authorized tool whatever the policy; the policy only decides whether plainly general questions may be answered from general knowledge or a controlled web search.
      properties:
        policy:
          type: string
          enum: [strict_kb, kb_plus_general, kb_general_external]
          description: strict_kb (default when knowledge is set) answers only from the knowledge base and tools; kb_plus_general adds general knowledge for plainly general questions; kb_general_external also allows the bot's web search for general or current questions (web search must still be enabled for the bot and its plan).
        ragMode:
          type: string
          enum: [auto, simple, standard, complex]
          deprecated: true
          description: Platform-managed (KNOWLEDGE_RAG_MODE, default auto); a business's save keeps the saved value. auto picks per message; a message holding two or more independent questions is retrieved question by question (complex).
        maxSubqueries:
          type: integer
          minimum: 0
          maximum: 5
          deprecated: true
          description: Platform-managed; a business's save keeps the saved value. Parallel searches for a complex message (0 means 3).
        verify:
          type: string
          enum: [off, shadow, enforce]
          deprecated: true
          description: |
            Platform-managed (KNOWLEDGE_VERIFY, default enforce); a business's save keeps the saved value. Checks each answered reply against its evidence. shadow records findings without changing the reply. enforce regenerates a draft once when it contains a price, percentage, duration, link, email or phone number found in no passage, tool result or customer message (on a stronger allowed tier when model routing is on and the evidence was adequate), and otherwise replaces it with a no-answer; it replaces a reply that reports an action as done when no tool call succeeded; and it appends which of the customer's questions found no evidence. Replies that used tools are never regenerated.
    BotRouting:
      type: object
      description: |
        Platform-managed and ignored: the platform's ROUTING_MODE routes every bot, classifying each message with built-in rules and answering from the platform catalog's tiers (fast for small talk, unclear messages and requests for a person; balanced for answers from the knowledge base, follow-ups and tool use; advanced for multi-part or comparison questions). A business's save keeps the saved block and drops what it sent.
      properties:
        mode:
          type: string
          enum: [disabled, shadow, enabled]
          description: shadow classifies and records what routing would do without changing the answering model; enabled picks the model. Unset is disabled.
        classifier:
          type: string
          enum: [rules, jev]
          description: Always rules; jev is accepted from older saves and means rules.
        allowedTiers:
          type: array
          uniqueItems: true
          items: {type: string, enum: [fast, balanced, advanced]}
        providerAllowlist:
          type: array
          maxItems: 20
          items: {type: string, example: anthropic}
        modelPools:
          type: object
          description: Catalog models, best first, per tier. Models must be active in the catalog (400 MODEL_NOT_ALLOWED).
          additionalProperties:
            type: array
            maxItems: 10
            items: {type: string}
        fixedModel:
          type: string
          description: Always answer with this catalog model; the router only checks it against the limits.
        maxRequestCostUsd:
          type: number
          description: Ignored; cost takes no part in choosing a model.
          minimum: 0
          maximum: 100
        maxAttempts:
          type: integer
          minimum: 0
          maximum: 3
    WebhookQueuedEvent:
      type: object
      properties:
        id: {type: string, example: evt_0123456789abcdef}
        event: {type: string, example: ticket.updated}
        status: {type: string, enum: [pending, delivered, dead]}
        attempts: {type: integer, description: Tries so far, the two quick ones made while handling the request included. An event is dead after 8.}
        next_attempt_at: {type: string, format: date-time, description: Only for pending events.}
        last_status: {type: integer, description: The endpoint's last HTTP status; absent if it did not answer.}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Workspace:
      type: object
      required: [name, bot, revision, history, defaults, modelSelection]
      properties:
        name:
          type: string
        bot:
          $ref: '#/components/schemas/Bot'
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
        history:
          type: array
          items:
            type: object
            required: [id, savedAt, bot]
            properties:
              id:
                type: string
              savedAt:
                type: string
                format: date-time
              bot:
                $ref: '#/components/schemas/Bot'
        defaults:
          type: object
          required: [name, bot]
          properties:
            name:
              type: string
            bot:
              $ref: '#/components/schemas/Bot'
        modelSelection:
          type: string
          enum: [platform]
          description: Always platform. The platform chooses each reply's model and how every bot answers, so a dashboard should hide the model, temperature, output limit, passage count, routing, retrieval mode and verification controls.
    KnowledgeDocument:
      type: object
      required: [id, title, source_type, byte_size, status, chunk_count, embedded_count, token_count, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        source_type:
          type: string
          enum: [manual, file]
        source_name:
          type: string
        mime_type:
          type: string
        byte_size:
          type: integer
        status:
          type: string
          enum: [pending_upload, processing, indexed, failed]
        error:
          type: string
          description: Why processing failed.
        chunk_count:
          type: integer
          description: Retrieval passages.
        embedded_count:
          type: integer
          description: Passages whose embeddings are written.
        token_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        indexed_at:
          type: string
          format: date-time
        source_url:
          type: string
        knowledge_base_id:
          type: string
        locale:
          type: string
        product:
          type: string
        version:
          type: string
        content:
          type: string
          description: The Markdown text; only when reading one document.
    ArticleInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Required when creating; omit when updating to keep the current title.
        content:
          type: string
          maxLength: 50000
          description: Required when creating; omit when updating to only rename.
        source_name:
          type: string
          maxLength: 260
          description: Original file name, for articles restored from a backup.
        source_url:
          type: string
          maxLength: 2000
          description: An http(s) link cited with answers; empty removes it. Changing it re-embeds nothing.
        knowledge_base_id:
          type: string
          maxLength: 64
          description: Filter metadata; changing it re-embeds the document's chunks. Empty removes it. The same applies to locale, product and version.
        locale:
          type: string
          maxLength: 64
        product:
          type: string
          maxLength: 64
        version:
          type: string
          maxLength: 64
    AttachmentIDs:
      type: array
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: Image input. Pictures for this message, from the registration endpoint of the same scope; each uploaded, unsent and registered within the last hour. The assistant reads them in this reply only. Not allowed with resend.
      items:
        type: string
        pattern: '^att_[0-9a-f]{32}$'
    AttachmentConfig:
      type: object
      required: [enabled, max_bytes, max_per_message, content_types]
      description: Image input. What a client may offer.
      properties:
        enabled:
          type: boolean
          description: False hides the attach control.
        reason:
          type: string
          enum: [plan, no_vision_model]
          description: With enabled false, on the playground route only - the plan has no image input, or no active model can read pictures.
        max_bytes:
          type: integer
          example: 20971520
          description: The largest upload; every picture is shrunk to at most 1 MiB before the assistant sees it.
        max_per_message:
          type: integer
          example: 3
        content_types:
          type: array
          items:
            type: string
          example: [image/jpeg, image/png, image/webp]
    AttachmentRegistration:
      type: object
      additionalProperties: false
      required: [filename, content_type, size, sha256]
      properties:
        filename:
          type: string
          maxLength: 260
          description: No slashes. Ends in .jpg, .jpeg, .png or .webp.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: What the file claims to be. The bytes are what count; a mismatch is found when the message is sent.
        size:
          type: integer
          minimum: 1
          maximum: 20971520
          description: Bytes, at most 20 MB.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    AttachmentUpload:
      type: object
      required: [attachment, url, method, headers, expires_at]
      properties:
        attachment:
          type: object
          required: [id, status, filename, content_type, size]
          properties:
            id:
              type: string
              pattern: '^att_[0-9a-f]{32}$'
            status:
              type: string
              enum: [pending]
            filename:
              type: string
            content_type:
              type: string
            size:
              type: integer
        url:
          type: string
          description: Presigned R2 URL. PUT the raw file here within 15 minutes.
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Send exactly these with the PUT.
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    Attachment:
      type: object
      required: [id, content_type, width, height, size, url, url_expires_at]
      description: Image input. A picture a message carried, as stored after shrinking.
      properties:
        id:
          type: string
          pattern: '^att_[0-9a-f]{32}$'
        content_type:
          type: string
          enum: [image/jpeg]
          description: Always the stored copy's type, whatever was uploaded.
        width:
          type: integer
        height:
          type: integer
        size:
          type: integer
          description: Bytes of the stored copy.
        url:
          type: string
          format: uri
          description: Signed link for showing the picture (works in an img tag), valid for 1 hour. Do not store it.
        url_expires_at:
          type: string
          format: date-time
    ChatMessage:
      type: object
      required: [role, content, created_at]
      properties:
        id:
          type: string
          description: Absent only on a reply that could not be stored.
        attachments:
          type: array
          description: Image input. The pictures a customer message carried; absent when it carried none.
          items:
            $ref: '#/components/schemas/Attachment'
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: The text. Replies may contain Markdown.
        author:
          type: string
          enum: [agent]
          description: Set on a reply a person wrote; absent for the assistant's replies and the customer's messages.
        agent:
          type: string
          description: Who wrote an agent reply, when known.
        created_at:
          type: string
          format: date-time
    ChatConversation:
      type: object
      required: [id, created_at, updated_at, messages]
      properties:
        id:
          type: string
        status:
          type: string
          description: open, or handoff once the conversation was flagged for the support team, by the assistant or the handoff endpoint (until a ticket picks it up or a person answers its ticket).
        channel_id:
          type: string
          description: The bot's channel the conversation started on (v2).
        customer_id:
          type: string
          description: The bot's customer the conversation was started for (v2).
        escalated:
          type: boolean
          description: True while a person has taken the conversation over; messages get no reply from the assistant until they hand it back. The bot's webhook reports their replies, or poll the conversation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          description: Oldest first.
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatReply:
      type: object
      required: [message, reply, status, sources]
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        reply:
          allOf:
            - $ref: '#/components/schemas/ChatMessage'
          nullable: true
          description: Null when status is escalated or context.
        status:
          $ref: '#/components/schemas/AnswerStatus'
        sources:
          type: array
          description: The documentation the reply cites; empty unless status is answered.
          items:
            $ref: '#/components/schemas/KnowledgeSource'
    ChatTicket:
      type: object
      required: [id, subject, status, priority, escalated, created_at]
      properties:
        id:
          type: string
          pattern: '^tkt_[0-9a-f]{32}$'
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        escalated:
          type: boolean
        channel_id:
          type: string
          pattern: '^chn_[0-9a-f]{32}$'
          description: The bot's channel the ticket came from (v2).
        created_at:
          type: string
          format: date-time
    ChatPlatformReply:
      type: object
      required: [message, escalated]
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        ticket_id:
          type: string
          pattern: '^tkt_[0-9a-f]{32}$'
          description: The conversation's open ticket, which the reply answers.
        escalated:
          type: boolean
          description: True while a person has the conversation, so the assistant doesn't reply.
    Webhook:
      type: object
      required: [url, enabled, secret_hint, events, created_at, updated_at]
      properties:
        url:
          type: string
        enabled:
          type: boolean
        secret:
          type: string
          description: The signing secret (whsec_…); only returned when it was just created or rotated.
        secret_hint:
          type: string
          description: The secret's last 4 characters, as whsec_…abcd.
        events:
          type: array
          items:
            type: string
            enum: [message.created, ticket.updated]
        last_delivery:
          $ref: '#/components/schemas/WebhookDelivery'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      required: [event, ok, at]
      properties:
        event:
          type: string
          enum: [message.created, ticket.updated, ping]
        ok:
          type: boolean
        status:
          type: integer
          description: The endpoint's HTTP status; absent when it didn't answer.
        error:
          type: string
        at:
          type: string
          format: date-time
    WebhookEvent:
      type: object
      description: The JSON body of a webhook delivery.
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          pattern: '^evt_[0-9a-f]{32}$'
          description: Also sent as X-Truplexy-Delivery; a retry repeats it.
        type:
          type: string
          enum: [message.created, ticket.updated, ping]
        created_at:
          type: string
          format: date-time
        data:
          oneOf:
            - $ref: '#/components/schemas/MessageCreatedData'
            - $ref: '#/components/schemas/TicketUpdatedData'
            - type: object
              description: ping
              properties:
                message:
                  type: string
    MessageCreatedData:
      type: object
      required: [conversation_id, ticket_id, message]
      properties:
        conversation_id:
          type: string
        ticket_id:
          type: string
        message:
          allOf:
            - $ref: '#/components/schemas/ChatMessage'
          description: The reply, as GET /conversations/{id} returns it.
    TicketUpdatedData:
      type: object
      required: [conversation_id, ticket]
      properties:
        conversation_id:
          type: string
        ticket:
          type: object
          required: [id, subject, status, priority, escalated]
          properties:
            id:
              type: string
            subject:
              type: string
            status:
              $ref: '#/components/schemas/TicketStatus'
            priority:
              $ref: '#/components/schemas/TicketPriority'
            escalated:
              type: boolean
              description: While true the assistant doesn't reply; once false it replies again.
    TicketUsage:
      type: object
      required: [input_tokens, output_tokens, total_tokens, cost]
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        cost:
          type: number
          description: What OpenRouter charged, in USD.
    TicketStatus:
      type: string
      enum: [open, closed]
      description: open while a person still has to act on the ticket, closed once it's done. A ticket moves freely between the two.
    TicketPriority:
      type: string
      enum: [low, normal, high, urgent]
    Ticket:
      type: object
      required: [id, subject, status, priority, escalated, source, needs_reply, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^tkt_[0-9a-f]{32}$'
        conversation_id:
          type: string
        channel:
          type: string
          enum: [api, playground]
          description: The linked conversation's kind, chat API or playground. The bot's channel is channel_id.
        channel_id:
          type: string
          pattern: '^chn_[0-9a-f]{32}$'
          description: The bot's channel the ticket came from (v2).
        channel_name:
          type: string
          description: The channel's name; a deleted channel keeps it (v2).
        channel_type:
          type: string
          description: The channel's type id, such as discord (v2).
        customer_id:
          type: string
          pattern: '^cus_[0-9a-f]{32}$'
          description: The bot's customer the ticket is from, taken from its conversation (v2).
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        assignee:
          type: string
          description: Free text an API caller set. The dashboard assigns members with assignee_user_id.
        assignee_user_id:
          type: string
          description: The member the ticket is assigned to.
        assignee_name:
          type: string
          description: The assigned member's name, or email.
        escalated:
          type: boolean
          description: While true, the assistant stores the conversation's messages without replying.
        escalated_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [dashboard, customer]
          description: customer when the chat API's escalate or ticket endpoint opened it.
        needs_reply:
          type: boolean
          description: The customer wrote after the last reply, and the ticket is open.
        handed_off:
          type: boolean
          description: The ticket's conversation is flagged for the team (the customer accepted a handoff, or the assistant handed off), and the ticket is open. A person's reply, escalating or closing the ticket clears it.
        last_customer_at:
          type: string
          format: date-time
        last_agent_at:
          type: string
          format: date-time
        first_response_at:
          type: string
          format: date-time
          description: When a person first replied to the customer.
        closed_at:
          type: string
          format: date-time
          description: When the ticket was last closed; cleared when it reopens.
        reopen_count:
          type: integer
        summary:
          type: string
          maxLength: 2001
          description: The AI summary a person last generated with POST /tickets/{id}/summary; absent until then.
        summary_at:
          type: string
          format: date-time
          description: When summary was generated. Messages after it aren't in the summary.
        keep_open:
          type: boolean
          description: True stops the ticket closing on its own (v2).
        auto_close_at:
          type: string
          format: date-time
          description: When the open ticket closes if nothing happens before - its last activity plus its channel's, channel type's or business's auto_close_hours. Absent when kept open, waiting on the team, or nothing sets a time (v2).
        auto_closed_at:
          type: string
          format: date-time
          description: When it last closed on its own; cleared when it reopens (v2).
        flags:
          type: object
          description: What needs attention beside the status. overdue is needs_reply for longer than the business's reply_target_hours; unassigned is an open ticket without assignee_user_id; reopened is reopen_count above 0.
          properties:
            needs_reply:
              type: boolean
            escalated:
              type: boolean
            handed_off:
              type: boolean
            unassigned:
              type: boolean
            overdue:
              type: boolean
            reopened:
              type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TicketReply:
      type: object
      required: [id, kind, content, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [reply, note]
        author:
          type: string
        content:
          type: string
        message_id:
          type: string
          description: The conversation message a reply was added as.
        created_at:
          type: string
          format: date-time
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [messages, replies]
          properties:
            messages:
              type: array
              description: The conversation's latest 200 messages, oldest first; empty without a conversation.
              items:
                type: object
                required: [id, role, content, author, created_at]
                properties:
                  id:
                    type: string
                  role:
                    type: string
                    enum: [user, assistant]
                  content:
                    type: string
                  author:
                    type: string
                    enum: [customer, assistant, agent]
                  agent:
                    type: string
                  via:
                    type: string
                    enum: [api]
                    description: Set on an agent reply sent from an integration's platform.
                  status:
                    type: string
                  error:
                    type: string
                  model:
                    type: string
                    description: The model that wrote an assistant reply, when usage was reported.
                  usage:
                    $ref: '#/components/schemas/TicketUsage'
                  created_at:
                    type: string
                    format: date-time
            replies:
              type: array
              items:
                $ref: '#/components/schemas/TicketReply'
            usage:
              description: Totals for every generated reply in the conversation, including messages older than the latest 200; absent without a conversation.
              allOf:
                - $ref: '#/components/schemas/TicketUsage'
                - type: object
                  required: [replies]
                  properties:
                    replies:
                      type: integer
                      description: Replies with reported usage.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: route not found
            request_id:
              type: string
              example: req_7eecc8be1e594f01a0ca18563223c9f0
            document_id:
              type: string
              description: With DUPLICATE_DOCUMENT, the document already holding this content.
            limit:
              type: string
              description: With PLAN_LIMIT_REACHED, the limit reached - bots, documents_per_bot, members, replies_per_month, tokens_per_month, web_search or image_input.
